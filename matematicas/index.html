<style>

.big-btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:72px; padding:0 30px; border:none; border-radius:24px; font-size:26px; font-weight:bold; color:#fff; background:var(--blue); box-shadow:0 6px 0 rgba(0,0,0,.18);}
.big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.big-btn.green{background:var(--green);} .big-btn.orange{background:var(--orange);} .big-btn.sky{background:var(--sky);}
.actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:16px;}

.fb.good{color:#166534;} .fb.bad{color:#9a3412;}
.result-stars{font-size:84px; text-align:center; letter-spacing:10px;} .result-score{font-size:40px; text-align:center; font-weight:bold;}
.confetti{position:fixed; top:-60px; font-size:40px; pointer-events:none; animation:fall linear forwards; z-index:50;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.typebox{display:flex;justify-content:center;margin-top:10px}
.typebox input{font-size:40px;width:220px;text-align:center;padding:10px;border-radius:18px;border:4px solid #bfdbfe;font-family:inherit;-webkit-user-select:text;user-select:text}
.exam-card{background:linear-gradient(135deg,#f97316,#3b82f6);width:100%;min-height:100px;flex-direction:row;align-items:center;gap:18px;margin-bottom:6px}
.exam-card .emo{font-size:56px}.exam-card .t{font-size:28px}.exam-card .stars{margin:0 0 0 auto;font-size:26px}
.sh-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sh-row h2{flex:1}
.sec-exam{border:none;border-radius:18px;padding:10px 16px;min-height:52px;font-size:19px;font-weight:bold;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.sec-exam:active{transform:translateY(3px)}
.review{text-align:left;font-size:20px;background:#fff7ed;border-radius:18px;padding:12px 18px;margin-top:10px}.review li{margin:4px 0}
.next-btn{min-width:240px}
.tip{font-size:19px; color:var(--muted); text-align:center; margin-top:10px;}
.reloj-top{display:flex; justify-content:center; gap:22px; align-items:center; margin:12px 0;}
.reloj-clock{font-size:64px; font-weight:bold; background:#fff; border-radius:50%; width:120px; height:120px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 rgba(0,0,0,.1); color:#0f766e;}
.reloj-clock.hurry{color:#dc2626; animation:shake .5s infinite;}
.reloj-score{font-size:40px; font-weight:bold;}
.reloj-pad{grid-template-columns:repeat(3,110px);} .reloj-pad button{height:90px; font-size:44px;}
@media (max-width:600px){ .story{font-size:22px;} .mental{font-size:60px;} .opt{font-size:24px;} }
</style>

<script>
"use strict";
const $app = document.getElementById('app');
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);

}
const speak = (t, rate) => window.Voz && Voz.speak(String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, ''), { lang: 'es', rate });
let actx = null;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (good ? [660, 880, 1175] : [300, 220]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.1;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const c = h('div', { class: 'confetti', style: { left: Math.random() * 100 + 'vw', animationDuration: (2 + Math.random() * 2) + 's', animationDelay: Math.random() * 0.6 + 's' } }, pick(['🎉', '⭐', '✨', '🎈', '🏆', '🚀']));
    document.body.append(c); setTimeout(() => c.remove(), 5000);
  }
}
const STORE = 'mi-examen-mate-v1';
const progress = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } })();
function saveBest(id, s) { if ((progress[id] || 0) < s) { progress[id] = s; try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} } }
const starsFor = (ok, total) => { const p = total ? ok / total : 0; return p >= 0.9 ? 3 : p >= 0.7 ? 2 : p >= 0.4 ? 1 : 0; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);

/* ============================================================
   GENERADORES
   ============================================================ */
// Mecanizados: [a, op, b]
function mec(kind) {
  for (;;) {
    const a = ri(11, 99), b = ri(11, 99), su = (a % 10) + (b % 10);
    if (kind === 'sumno') { if (su < 10 && a + b < 100) return [a, '+', b]; continue; }
    if (kind === 'sum') { if (su >= 10 && a + b < 100) return [a, '+', b]; continue; }
    if (kind === 'sum100') { if (su >= 10 && a + b >= 100) return [a, '+', b]; continue; }
    if (kind === 'resno') { if (a > b && a % 10 >= b % 10) return [a, '-', b]; continue; }
    if (kind === 'res') { if (a > b + 9 && a % 10 < b % 10) return [a, '-', b]; continue; }
  }
}
// 3 cifras: llevando / pidiendo prestado en cualquier columna (sin pedir prestado a un 0)
const digitsOf = n => String(n).split('').reverse().map(Number);
function mec3(kind) {
  for (;;) {
    const a = ri(101, 999), b = ri(101, 999), A = digitsOf(a), B = digitsOf(b);
    if (kind === 'sum3k') { if (a + b >= 1000) return [a, '+', b]; continue; } // pasa de 1000 (UM)
    if (kind === 'sum3no' || kind === 'sum3') {
      if (a + b > 999) continue;
      const carries = [0, 1, 2].some(i => A[i] + B[i] + (i && A[i - 1] + B[i - 1] >= 10 ? 1 : 0) >= 10);
      if ((kind === 'sum3') === carries) return [a, '+', b];
      continue;
    }
    if (a <= b) continue;
    const borrows = [0, 1].some(i => A[i] < B[i]);
    if (kind === 'res3no') { if (!borrows) return [a, '-', b]; continue; }
    if (!borrows) continue;
    // válido si ningún paso pide prestado a un 0 (sería préstamo en cadena)
    const { steps } = Columna.plan(a, b, '-');
    if (steps.every(st => st.expect >= 0 && (st.kind !== 'borrow' || st.from >= 1))) return [a, '-', b];
  }
}
// Restas con ceros: hay que pedirle prestado a un 0 (el préstamo "baja" en cadena)
function mec0(kind) {
  for (;;) {
    let a, b;
    if (kind === 'one') { const u = ri(0, 8); a = ri(1, 9) * 100 + u; b = ri(10, a - 1); if (b % 10 <= u) continue; }   // 503 − 128
    else if (kind === 'two') { a = ri(1, 9) * 100; b = ri(11, a - 1); if (b % 10 === 0) continue; }                    // 500 − 247
    else return pick([() => mec0('one'), () => mec0('two'), () => mec3('res3')])();
    const { steps } = Columna.plan(a, b, '-');
    if (steps.some(st => st.chain)) return [a, '-', b];
  }
}
const CERO_EJEMPLOS = [[503, 128], [400, 156], [302, 175], [600, 248], [805, 269]];
// Razonados: historias con sumas y restas (contexto mexicano)
const NAMES = ['Mateo', 'Sofía', 'Diego', 'Valeria', 'Leo', 'Regina', 'Santi', 'Ximena', 'Tomás', 'Camila', 'Iker', 'Renata'];
// Cada historia: s = lo que pasa (con {a} y {b}), d = un dato que NO sirve (con {x}), q = la pregunta.
// la/lb = etiquetas de los datos, u = unidad de la respuesta, big = también sirve con números de 3 cifras.
const STORIES = [
  { op: '+', s: '{n} tiene {a} estampas. Su tío le regala {b} más.', d: '{n} tiene {x} años.', q: '¿Cuántas estampas tiene ahora?', la: 'Tiene', lb: 'Le regalan', u: 'estampas', big: true },
  { op: '+', s: 'En una caja hay {a} crayolas y en otra caja hay {b}.', d: 'Las cajas cuestan {x} pesos.', q: '¿Cuántas crayolas hay en total?', la: 'Caja 1', lb: 'Caja 2', u: 'crayolas' },
  { op: '+', s: 'En la mañana se vendieron {a} tamales y en la tarde {b}.', d: 'La tienda abre a las {x}.', q: '¿Cuántos tamales se vendieron en todo el día?', la: 'Mañana', lb: 'Tarde', u: 'tamales', big: true },
  { op: '+', s: '{n} leyó {a} páginas el lunes y {b} páginas el martes.', d: 'Su libro tiene {x} dibujos.', q: '¿Cuántas páginas leyó en los dos días?', la: 'Lunes', lb: 'Martes', u: 'páginas', big: true },
  { op: '+', s: 'En el camión escolar iban {a} alumnos. En la siguiente parada se subieron {b}.', d: 'El camión tiene {x} ventanas.', q: '¿Cuántos alumnos van ahora?', la: 'Iban', lb: 'Se subieron', u: 'alumnos' },
  { op: '+', s: '{n} ahorró {a} pesos y su abuelita le dio {b} pesos.', d: 'Su alcancía es de hace {x} años.', q: '¿Cuántos pesos tiene en total?', la: 'Ahorró', lb: 'Le dio', u: 'pesos', big: true },
  { op: '-', s: '{n} tenía {a} canicas y regaló {b} a sus amigos.', d: 'Tiene {x} amigos en su salón.', q: '¿Cuántas canicas le quedan?', la: 'Tenía', lb: 'Regaló', u: 'canicas' },
  { op: '-', s: 'En el árbol había {a} pajaritos. Se fueron volando {b}.', d: 'El árbol mide {x} metros.', q: '¿Cuántos pajaritos quedan?', la: 'Había', lb: 'Se fueron', u: 'pajaritos' },
  { op: '-', s: '{n} tiene {a} pesos y compra una pelota de {b} pesos.', d: 'La pelota es de {x} colores.', q: '¿Cuántos pesos le sobran?', la: 'Tiene', lb: 'La pelota cuesta', u: 'pesos', big: true },
  { op: '-', s: 'Una caja trae {a} galletas. En el recreo se comieron {b}.', d: 'El recreo dura {x} minutos.', q: '¿Cuántas galletas quedan?', la: 'La caja trae', lb: 'Se comieron', u: 'galletas' },
  { op: '-', s: '{n} tiene {a} carritos y {m} tiene {b}.', d: '{m} tiene {x} años.', q: '¿Cuántos carritos más tiene {n}?', la: '{n} tiene', lb: '{m} tiene', u: 'carritos' },
  { op: '-', s: 'El libro tiene {a} páginas. {n} ya leyó {b}.', d: 'El libro tiene {x} capítulos.', q: '¿Cuántas páginas le faltan por leer?', la: 'El libro tiene', lb: 'Ya leyó', u: 'páginas', big: true },
  // Solo con números grandes (3 cifras)
  { op: '+', s: 'En la escuela hay {a} alumnos en la mañana y {b} en la tarde.', d: 'La escuela tiene {x} salones.', q: '¿Cuántos alumnos hay en total?', la: 'Mañana', lb: 'Tarde', u: 'alumnos', big: true, only: true },
  { op: '+', s: 'Un avión llevaba {a} pasajeros y en la escala se subieron {b}.', d: 'El piloto ha volado {x} años.', q: '¿Cuántos pasajeros lleva ahora?', la: 'Llevaba', lb: 'Se subieron', u: 'pasajeros', big: true, only: true },
  { op: '-', s: 'Una tienda tenía {a} paletas y vendió {b}.', d: 'Hay paletas de {x} sabores.', q: '¿Cuántas paletas le quedan?', la: 'Tenía', lb: 'Vendió', u: 'paletas', big: true, only: true },
  { op: '-', s: 'En el estadio caben {a} personas y ya entraron {b}.', d: 'El partido empieza a las {x}.', q: '¿Cuántas personas faltan para llenarlo?', la: 'Caben', lb: 'Ya entraron', u: 'personas', big: true, only: true },
];
const UNITS = [...new Set(STORIES.map(s => s.u))];
const KEYWORDS = { '+': 'Pistas de SUMA: "le regalan", "en total", "se subieron", "juntos", "ahora tiene más".', '-': 'Pistas de RESTA: "regaló", "se fueron", "le quedan", "le sobran", "le faltan", "¿cuántos más?".' };
function razonado(big) {
  const s = pick(STORIES.filter(x => big ? x.big : !x.only)), [n, m] = shuffle(NAMES);
  const [p, , q] = big ? mec3(s.op === '+' ? pick(['sum3no', 'sum3', 'sum3']) : pick(['res3no', 'res3', 'res3']))
    : mec(s.op === '+' ? pick(['sumno', 'sum', 'sum']) : pick(['resno', 'res', 'res']));
  const a = Math.max(p, q), b = Math.min(p, q);
  let x; do { x = ri(3, 12); } while (x === a || x === b);
  const fill = t => t.replace(/\{n\}/g, n).replace(/\{m\}/g, m);
  const parts = [fill(s.s), fill(s.d), fill(s.q)];
  const text = parts.join(' ').replace('{a}', a).replace('{b}', b).replace('{x}', x);
  const units = shuffle([s.u, ...shuffle(UNITS.filter(u => u !== s.u)).slice(0, 2)]);
  return { text, parts, unit: s.u, units, op: s.op, a, b, x, la: fill(s.la), lb: fill(s.lb) };
}
// Cálculo mental
function mental(kind) {
  if (kind === 'diez') { const a = ri(2, 9), b = 10 - a; return pick([[a, '+', b], [10, '-', a]]); }
  if (kind === 'veinte') { const a = ri(3, 9), b = ri(3, 9); return pick([[a, '+', b], [a + b, '-', b]]); }
  if (kind === 'decenas') { const a = ri(1, 7) * 10, b = ri(1, 9 - a / 10) * 10; return pick([[a, '+', b], [a + b, '-', b]]); }
  if (kind === 'mas10') { const a = ri(11, 89); return pick([[a, '+', 10], [a, '-', 10], [a, '+', 20]]); }
  if (kind === 'dobles') { const a = ri(2, 10); return [a, '+', a]; }
  const a = ri(11, 89), b = ri(1, 9); return [a, '+', b];
}
const calc = ([a, op, b]) => op === '+' ? a + b : a - b;
const sign = op => op === '+' ? '+' : '−';
const word = op => op === '+' ? 'más' : 'menos';

/* ============================================================
   TEMAS
   ============================================================ */
const SECTIONS = [
  { id: 'mecanizados', name: '🧮 Mecanizados', es: 'Sumas y restas en columna, de derecha a izquierda.' },

    const goColumn = () => renderColumn(p.a, p.op, p.b, {
      head: h('div', null, plainStory(), rows.cloneNode(true), h('div', { class: 'ask' }, `3️⃣ ${p.op === '+' ? '➕ Suma' : '➖ Resta'}: ${p.a} ${sign(p.op)} ${p.b}`)),
      finish: ({ mistakes, side, errs, r }) => {
        if (mistakes) failed.push('Cuenta: ' + ((errs || []).join(' · ') || 'se equivocó en la columna'));
        side.innerHTML = '';
        const ask = h('div', { class: 'ask' }, `4️⃣ Resultado: ${r} ¿qué?`);
        const res = h('div');
        let done = false;
        const opts = p.units.map(u => {
          const b = h('button', { class: 'opt unit', onclick: () => {
            if (done) return;
            if (u !== p.unit) {
              b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); beep(false);
              if (!failed.some(x => /^Resultado/.test(x))) failed.push('Resultado: puso "' + u + '"');
              if (!exam) { res.className = 'fb bad'; res.textContent = '🤔 Vuelve a leer la pregunta: ¿qué se está contando?'; return; }
              opts.find(x => x.textContent === p.unit).classList.add('ok');
            } else b.classList.add('ok');
            done = true; finishAll(r, side, res);
          } }, u);
          return b;
        });
        side.append(ask, h('div', { class: 'opts units' }, opts), res);
        setTimeout(() => { try { ask.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {} }, 100);
      },
    });
    function finishAll(r, side, res) {
      const bad = failed.length > 0;
      const correcta = `${r} ${p.unit}`;
      if (bad && window.Errores) Errores.log({ materia: 'Matemáticas', tema: title, pregunta: `${p.text} (${p.a} ${sign(p.op)} ${p.b})`, respuesta: failed.join(' · '), correcta, modo: exam ? 'examen' : 'práctica', tipo: 'column', col: { a: p.a, b: p.b, op: p.op } });
      if (!bad) clean++; else review.push(`${p.op === '+' ? 'Era suma' : 'Era resta'} ➜ ${p.a} ${sign(p.op)} ${p.b} = ${correcta}`);
      beep(true); confetti(bad ? 10 : 24);
      res.className = 'answer'; res.textContent = `Resultado: ${correcta} ✅`;
      speak(`Resultado: ${correcta}`);
      side.append(nextBtn());
    }
    card.append(story, rows, stepTitle, area, fb,
      h('div', { class: 'tip' }, '✏️ Si quieres, usa el Borrador para dibujar el problema.'));
    frame(card);
    speak(p.text);
  }
  function renderMental(q) {
    const ans = calc(q);
    let tries = 0, done = false;
    const box = h('span', { class: 'box' }, '?');
    const line = h('div', { class: 'mental' }, `${q[0]} ${sign(q[1])} ${q[2]} = `, box);
    const fb = h('div', { class: 'fb' });
    const actions = h('div', { class: 'actions' });
    // Respuesta con las mismas cajitas de Español/Inglés: ✍️ escribir (primero), 🔢 números o ⌨️ teclado
    const input = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': 'Respuesta' });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doCheck(); });
    const check = h('button', { class: 'big-btn', onclick: () => input.__guard ? input.__guard(doCheck) : doCheck() }, 'Comprobar ✔');
    const finish = ok => {
      done = true; input.disabled = true; check.remove(); box.textContent = String(ans);
      if (ok && !tries) clean++; else review.push(`${q[0]} ${sign(q[1])} ${q[2]} = ${ans}`);
      actions.append(nextBtn());
    };
    function doCheck() {
      if (done) return;
      const v = input.value.replace(/\s/g, '');
      if (!v) { input.focus(); return; }
      if (+v === ans) {
        line.className = 'mental ok'; beep(true);
        fb.className = 'fb good'; fb.textContent = pick(['¡Muy bien! 🎉', '¡Excelente! 🌟', '¡Súper! 💪', '¡Rapidísimo! 🚀']);
        speak(`¡Muy bien! ${q[0]} ${word(q[1])} ${q[2]} es igual a ${ans}`);
        finish(true);
      } else {
        tries++; beep(false); line.className = 'mental'; void line.offsetWidth; line.className = 'mental no';
        fb.className = 'fb bad';
        if (exam || tries >= 2) {
          // "Errores para repasar": solo la respuesta final equivocada
          if (window.Errores) Errores.log({ materia: 'Matemáticas', tema: title, pregunta: `${q[0]} ${sign(q[1])} ${q[2]} = ?`, respuesta: v, correcta: String(ans), modo: exam ? 'examen' : 'práctica', tipo: 'type', numeric: true, answers: [String(ans)], say: `¿Cuánto es ${q[0]} ${word(q[1])} ${q[2]}?` });
          fb.textContent = `La respuesta es ${ans}. ${tipFor(q)}`; finish(false);
        }
        else fb.textContent = '¡Casi! Revisa y corrige tu respuesta 💪';
      }
    }
    const answerPad = window.Escritura
      ? Escritura.pad({ q: { answer: [String(ans)], numeric: true }, input, lang: 'es', exam, submit: doCheck, typebox: h('div', { class: 'typebox' }, input) })
      : h('div', { class: 'typebox' }, input);
    actions.append(check);
    frame(h('div', { class: 'card' }, h('div', { style: { textAlign: 'center' } }, h('button', { class: 'big-btn sky', style: { minHeight: '52px', fontSize: '20px' }, onclick: () => speak(`¿Cuánto es ${q[0]} ${word(q[1])} ${q[2]}?`) }, '🔊 Escuchar')), line, answerPad, fb, actions));
  }
  render();
}
// "Mira cómo se hace": para que papá/mamá expliquen las restas con ceros paso a paso
function showDemo(k) {
  const [a, b] = CERO_EJEMPLOS[k % CERO_EJEMPLOS.length];
  const card = h('div', { class: 'card' },
    h('div', { class: 'story', style: { fontSize: '20px' } },
      h('b', null, '👩‍🏫 Para explicar: '), '¿Qué pasa si hay que pedir prestado y el vecino es un ', h('b', null, '0'), '? ¡El 0 no tiene nada que prestar! Entonces:',
      h('ol', { style: { margin: '8px 0 0', paddingLeft: '26px', lineHeight: '1.5' } },
        h('li', null, 'Las unidades no alcanzan (arriba hay menos que abajo).'),
        h('li', null, 'Las decenas tienen 0: vamos con las ', h('b', null, 'centenas'), '. Prestan 1 y quedan con uno menos.'),
        h('li', null, 'Ese 1 llega a las decenas como ', h('b', null, '10'), '.'),
        h('li', null, 'Ahora las decenas sí prestan: el 10 se vuelve ', h('b', null, '9'), ' y las unidades reciben 10.'),
        h('li', null, 'Ya se puede restar: unidades, decenas y centenas.'))),
    h('div', { class: 'ask' }, `Ejemplo ${k % CERO_EJEMPLOS.length + 1} de ${CERO_EJEMPLOS.length}: toquen ▶ para ver cada paso`),
    Columna.create({ a, b, op: '-', speak, demo: true, onDone: ({ side }) => {
      beep(true); confetti(16);
      side.innerHTML = '';
      side.append(h('button', { class: 'big-btn sky next-btn', onclick: () => showDemo(k + 1) }, 'Otro ejemplo ▶'),
        h('button', { class: 'big-btn green next-btn', style: { marginTop: '12px' }, onclick: () => start(TOPICS.find(t => t.id === 'res0')) }, '¡Ahora tú! ✍️'));
    } }));
  screen('👩‍🏫 Restas con ceros', goHome, card);
}
function tipFor([a, op, b]) {
  if (b === 10 || b === 20) return `Solo cambian las decenas: ${op === '+' ? 'suma' : 'resta'} ${b / 10} a las decenas.`;
  if (a % 10 === 0 && b % 10 === 0) return `Piensa en decenas: ${a / 10} ${sign(op)} ${b / 10} = ${calc([a / 10, op, b / 10])}, luego agrega el 0.`;
  if (a === b) return `Es un doble: ${a} + ${a}.`;
  return 'Puedes contar con los dedos o buscar el 10.';
}
function results({ id, title, ok, total, review, again, exam, next, nextLabel, real, info }) {
  const stars = starsFor(ok, total);
  saveBest(id, stars);
  if (window.Progreso) Progreso.hecho({ materia: 'Matemáticas', tema: title, id, pag: 'matematicas', score: ok, total, exam: !!exam });
  const msg = stars === 3 ? '¡Increíble! 🌟' : stars === 2 ? '¡Muy bien! Ya casi lo dominas 💪' : stars === 1 ? '¡Buen intento! Vamos a practicar un poquito más 🙂' : '¡No te rindas! Inténtalo otra vez 💙';
  screen(title, goHome,
    h('div', { class: 'card', style: { textAlign: 'center' } },
      h('div', { class: 'result-stars' }, starStr(stars)),
      h('div', { class: 'result-score' }, `${ok} / ${total}`),
      h('p', { style: { fontSize: '20px', color: '#64748b' } }, real ? 'Respuestas correctas' : 'Ejercicios resueltos sin errores'),
      real ? h('div', { class: 'xm-grade' }, `🎓 Calificación: ${Examen.calif(ok, total)}`) : null,
      h('p', { style: { fontSize: '26px' } }, msg),
      real && info && info.timeUp ? h('p', { style: { fontSize: '22px' } }, '⏰ Se acabó el tiempo. Los que faltaron cuentan como no contestados.') : null,
      real ? h('div', { class: 'review', style: { textAlign: 'left' } }, h('b', null, 'Tus respuestas:'), Examen.resumen(real)) : null,
      review.length ? h('div', { class: 'review' }, h('b', null, 'Para repasar:'), h('ul', null, review.map(r => h('li', null, r)))) : null),
    h('div', { class: 'actions' },
      h('button', { class: 'big-btn orange', onclick: again }, '🔁 Otra vez'),
      next ? h('button', { class: 'big-btn green', onclick: next }, nextLabel) : null,
      h('button', { class: 'big-btn', onclick: goHome }, '🏠 Inicio')));
  if (stars >= 2) { confetti(stars === 3 ? 40 : 20); beep(true); }
}

/* ============================================================
   ⏱️ CONTRA RELOJ: cálculo mental durante 1 minuto (récord en este dispositivo)
   ============================================================ */
const RELOJ_KEY = 'mi-examen-mate-reloj-v1', RELOJ_SEG = 60;
function relojBest() { try { return JSON.parse(localStorage.getItem(RELOJ_KEY)) || { best: 0 }; } catch (e) { return { best: 0 }; } }
let relojTimer = null;
function stopReloj() { if (relojTimer) { clearInterval(relojTimer); relojTimer = null; } }
function relojQ() { return mental(pick(['diez', 'veinte', 'veinte', 'dobles', 'decenas', 'mas10', 'mas10', 'x'])); }
function startReloj() {
  stopReloj();
  const rec = relojBest();
  screen('⏱️ Contra reloj', () => { stopReloj(); goHome(); },
    h('div', { class: 'card', style: { textAlign: 'center' } },
      h('div', { style: { fontSize: '72px' } }, '⏱️'),
      h('p', { style: { fontSize: '26px', margin: '6px 0' } }, `¿Cuántas cuentas puedes contestar en ${RELOJ_SEG} segundos?`),
      h('p', { style: { fontSize: '20px', color: '#64748b' } }, 'Escribe la respuesta con los números y toca ✔. Si te equivocas, no pasa nada: sigue con la próxima.'),
      h('p', { class: 'result-score', style: { fontSize: '30px' } }, '🏅 Tu récord: ' + rec.best),
      h('div', { class: 'actions' }, h('button', { class: 'big-btn green', style: { minWidth: '260px', minHeight: '90px', fontSize: '32px' }, onclick: runReloj }, '¡Empezar! ▶'))));
}
function runReloj() {
  stopReloj();
  const end = Date.now() + RELOJ_SEG * 1000;
  let ok = 0, bad = 0, q = null, ans = 0, val = '', locked = false, last = '';
  const misses = [];
  const clock = h('div', { class: 'reloj-clock' }, String(RELOJ_SEG));
  const bar = h('div', { class: 'progress' }, h('div', { style: { width: '100%', background: 'linear-gradient(90deg,#f97316,#facc15)' } }));
  const score = h('div', { class: 'reloj-score' }, '✅ 0');
  const line = h('div', { class: 'mental' });
  const fb = h('div', { class: 'fb' });
  function nextQ() {
    do { q = relojQ(); } while (q.join() === last); last = q.join();
    ans = calc(q); val = ''; locked = false; draw();
  }
  function draw() { line.className = 'mental'; line.innerHTML = ''; line.append(`${q[0]} ${sign(q[1])} ${q[2]} = `, h('span', { class: 'box' }, val || '?')); }
  function press(d) {
    if (locked) return;
    if (d === 'del') { val = val.slice(0, -1); draw(); return; }
    if (val.length >= 3) return;
    val += d; draw(); // se revisa al tocar ✔ (no se adivina por el número de cifras)
  }
  function check() {
    if (!val || locked) return;
    locked = true;
    if (+val === ans) { ok++; beep(true); line.className = 'mental ok'; fb.className = 'fb good'; fb.textContent = pick(['¡Bien! ⚡', '¡Rápido! 🚀', '¡Eso! ✅']); setTimeout(nextQ, 250); }
    else { bad++; beep(false); line.className = 'mental no'; fb.className = 'fb bad'; fb.textContent = `Era ${ans}`; misses.push(`${q[0]} ${sign(q[1])} ${q[2]} = ${ans}`); setTimeout(nextQ, 900); }
    score.textContent = '✅ ' + ok;
  }
  const pad = h('div', { class: 'pad reloj-pad' },
    ...'123456789'.split('').map(d => h('button', { onclick: () => press(d) }, d)),
    h('button', { class: 'del', onclick: () => press('del') }, '⌫'),
    h('button', { onclick: () => press('0') }, '0'),
    h('button', { class: 'chk', onclick: check }, '✔'));
  screen('⏱️ Contra reloj', () => { if (confirm('¿Salir? Se perderá esta ronda.')) { stopReloj(); goHome(); } },
    bar, h('div', { class: 'reloj-top' }, clock, score),
    h('div', { class: 'card', style: { textAlign: 'center' } }, line, fb, pad));
  nextQ();
  const tick = () => {
    const left = Math.max(0, end - Date.now());
    clock.textContent = String(Math.ceil(left / 1000));
    bar.firstChild.style.width = (left / (RELOJ_SEG * 10)) + '%';
    clock.classList.toggle('hurry', left <= 10000);
    if (left <= 0) { stopReloj(); relojDone(ok, bad, misses); }
  };
  relojTimer = setInterval(tick, 200); tick();
}
function relojDone(ok, bad, misses) {
  const rec = relojBest(), nuevo = ok > rec.best;
  if (window.Progreso) Progreso.hecho({ materia: 'Matemáticas', tema: '⏱️ Contra reloj', id: 'm-reloj', pag: 'matematicas', score: ok, total: ok });
  if (nuevo) { try { localStorage.setItem(RELOJ_KEY, JSON.stringify({ best: ok, fecha: Date.now() })); } catch (e) {} }
  saveBest('m-reloj', ok >= 15 ? 3 : ok >= 10 ? 2 : ok >= 5 ? 1 : 0);
  screen('⏱️ Contra reloj', goHome,
    h('div', { class: 'card', style: { textAlign: 'center' } },
      h('div', { style: { fontSize: '70px' } }, nuevo ? '🏆' : '⏱️'),
      h('div', { class: 'result-score' }, `✅ ${ok} en ${RELOJ_SEG} segundos`),
      h('p', { style: { fontSize: '26px' } }, nuevo ? (rec.best ? `¡NUEVO RÉCORD! Antes: ${rec.best} 🎉` : '¡Tu primer récord! 🎉') : `Tu récord es ${rec.best}. ¡Tú puedes superarlo! 💪`),
      bad ? h('p', { style: { fontSize: '20px', color: '#64748b' } }, `Te equivocaste en ${bad}.`) : null,
      misses.length ? h('div', { class: 'review' }, h('b', null, 'Para repasar:'), h('ul', null, misses.slice(0, 8).map(r => h('li', null, r)))) : null),
    h('div', { class: 'actions' },
      h('button', { class: 'big-btn orange', onclick: runReloj }, '🔁 Otra vez'),
      h('button', { class: 'big-btn', onclick: goHome }, '🏠 Inicio')));
  if (nuevo || ok >= 10) { confetti(nuevo ? 40 : 20); beep(true); }
}

/* ---------- 📅 Repaso para mañana (se abre desde el inicio) ----------
   ?repaso=mecanizados,razonados,mental&n=6&dia=miércoles&next=../ingles/?repaso=... */
const safeNext = u => (u && /^\.\.\/([a-z]+\/)?(\?[\w.,=&%-]*)?$/.test(u)) ? u : '../';
function startRepaso(secs, n, next, dia) {
  const pools = SECTIONS.filter(x => secs.includes(x.id)).map(x => shuffle(TOPICS.filter(t => t.sec === x.id && t.kind !== 'demo' && t.kind !== 'reloj')));
  if (!pools.length) return false;
  const order = [];
  for (let k = 0; order.length < n; k++) { const pool = pools[k % pools.length]; order.push(pool[Math.floor(k / pools.length) % pool.length]); }
  let j = 0;
  const last = next === '../';
  runSet({ id: 'repaso', title: '📅 Repaso' + (dia ? ' para el ' + dia : ''), total: n, exam: false,
    next: () => itemFor(order[j++ % order.length]), again: () => startRepaso(secs, n, next, dia),
    after: { next: () => { location.href = next; }, label: last ? '🏁 Terminé el repaso' : 'Seguir con el repaso ➜' } });
  return true;
}

showHome();
if (window.Escritura) Escritura.borrador();
const RP = new URLSearchParams(location.search);
const tm = /^#tema-(.+)$/.exec(location.hash), tid = tm && decodeURIComponent(tm[1]);
if (RP.get('repaso')) { startRepaso(RP.get('repaso').split(','), Math.min(20, +RP.get('n') || 6), safeNext(RP.get('next')), RP.get('dia')); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
// Enlace directo a un tema (p. ej. #tema-res, desde las estrellas del inicio)
else if (tid && TOPICS.some(t => t.id === tid)) start(TOPICS.find(t => t.id === tid));
else if (location.hash) { const el = document.getElementById('sec-' + location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); }
</script>
