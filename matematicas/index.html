<style>
:root{--blue:#3b82f6; --sky:#0ea5e9; --teal:#14b8a6; --green:#22c55e; --orange:#f97316; --yellow:#fde68a; --ink:#1e293b; --muted:#64748b;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; min-height:100%;}
html{background:#e0f2fe linear-gradient(160deg,#e0f2fe 0%,#f0fdf4 55%,#fef9c3 100%) no-repeat; background-size:100% 100%; min-height:100%;}
body{min-height:100vh; font-family:"Chalkboard SE","Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:manipulation; -webkit-text-size-adjust:100%;}
button{font-family:inherit; cursor:pointer; touch-action:manipulation; color:var(--ink);}
header{display:flex; align-items:center; gap:12px; padding:12px 18px; padding-top:max(12px, env(safe-area-inset-top));}
header h1{flex:1; margin:0; font-size:28px; text-align:center;}
.iconbtn{min-width:64px; height:64px; border:none; border-radius:20px; background:#fff; font-size:30px; box-shadow:0 4px 0 rgba(0,0,0,.12); text-decoration:none; display:flex; align-items:center; justify-content:center;}
main{max-width:980px; margin:0 auto; padding:8px 18px 90px;}
.card{background:#fff; border-radius:28px; padding:22px 24px; box-shadow:0 8px 24px rgba(30,60,110,.12); margin-bottom:18px;}
.hello{font-size:22px; text-align:center; margin:0 0 10px;}
.section-head{margin:24px 4px 10px;} .section-head h2{margin:0; font-size:28px;} .section-head p{margin:4px 0 0; color:var(--muted); font-size:18px;}
.topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}

.opts{display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:620px; margin:10px auto;}

.answer{font-size:28px; text-align:center; background:#dcfce7; color:#166534; border-radius:20px; padding:14px; margin-top:14px; font-weight:bold;}
.mental{font-size:84px; font-weight:bold; text-align:center; margin:6px 0;}

.fb{text-align:center; font-size:24px; min-height:36px; margin-top:10px;}

@keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}

.exam-card{background:linear-gradient(135deg,#f97316,#3b82f6);width:100%;min-height:100px;flex-direction:row;align-items:center;gap:18px;margin-bottom:6px}
.exam-card .emo{font-size:56px}.exam-card .t{font-size:28px}.exam-card .stars{margin:0 0 0 auto;font-size:26px}
.sh-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sh-row h2{flex:1}
.sec-exam{border:none;border-radius:18px;padding:10px 16px;min-height:52px;font-size:19px;font-weight:bold;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.sec-exam:active{transform:translateY(3px)}
.review{text-align:left;font-size:20px;background:#fff7ed;border-radius:18px;padding:12px 18px;margin-top:10px}.review li{margin:4px 0}
.next-btn{min-width:240px}
.tip{font-size:19px; color:var(--muted); text-align:center; margin-top:10px;}
.reloj-top{display:flex; justify-content:center; gap:22px; align-items:center; margin:12px 0;}
.reloj-clock{font-size:64px; font-weight:bold; background:#fff; border-radius:50%; width:120px; height:120px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 rgba(0,0,0,.1); color:#0f766e;}
.reloj-clock.hurry{color:#dc2626; animation:shake .5s infinite;}
.reloj-score{font-size:40px; font-weight:bold;}
.reloj-pad{grid-template-columns:repeat(3,110px);} .reloj-pad button{height:90px; font-size:44px;}
@media (max-width:600px){ .story{font-size:22px;} .mental{font-size:60px;} .opt{font-size:24px;} }

<script>
"use strict";
const $app = document.getElementById('app');
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const speak = (t, rate) => window.Voz && Voz.speak(String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, ''), { lang: 'es', rate });
let actx = null;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (good ? [660, 880, 1175] : [300, 220]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.1;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const c = h('div', { class: 'confetti', style: { left: Math.random() * 100 + 'vw', animationDuration: (2 + Math.random() * 2) + 's', animationDelay: Math.random() * 0.6 + 's' } }, pick(['🎉', '⭐', '✨', '🎈', '🏆', '🚀']));
    document.body.append(c); setTimeout(() => c.remove(), 5000);
  }
}
const STORE = 'mi-examen-mate-v1';
const progress = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } })();
function saveBest(id, s) { if ((progress[id] || 0) < s) { progress[id] = s; try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} } }
const starsFor = (ok, total) => { const p = total ? ok / total : 0; return p >= 0.9 ? 3 : p >= 0.7 ? 2 : p >= 0.4 ? 1 : 0; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);

/* ============================================================
   GENERADORES
   ============================================================ */
// Mecanizados: [a, op, b]
function mec(kind) {
  for (;;) {
    const a = ri(11, 99), b = ri(11, 99), su = (a % 10) + (b % 10);
    if (kind === 'sumno') { if (su < 10 && a + b < 100) return [a, '+', b]; continue; }
    if (kind === 'sum') { if (su >= 10 && a + b < 100) return [a, '+', b]; continue; }
    if (kind === 'sum100') { if (su >= 10 && a + b >= 100) return [a, '+', b]; continue; }
    if (kind === 'resno') { if (a > b && a % 10 >= b % 10) return [a, '-', b]; continue; }
    if (kind === 'res') { if (a > b + 9 && a % 10 < b % 10) return [a, '-', b]; continue; }
  }
}
// 3 cifras: llevando / pidiendo prestado en cualquier columna (sin pedir prestado a un 0)
const digitsOf = n => String(n).split('').reverse().map(Number);
function mec3(kind) {
  for (;;) {
    const a = ri(101, 999), b = ri(101, 999), A = digitsOf(a), B = digitsOf(b);
    if (kind === 'sum3k') { if (a + b >= 1000) return [a, '+', b]; continue; } // pasa de 1000 (UM)
    if (kind === 'sum3no' || kind === 'sum3') {
      if (a + b > 999) continue;
      const carries = [0, 1, 2].some(i => A[i] + B[i] + (i && A[i - 1] + B[i - 1] >= 10 ? 1 : 0) >= 10);
      if ((kind === 'sum3') === carries) return [a, '+', b];
      continue;
    }
    if (a <= b) continue;
    const borrows = [0, 1].some(i => A[i] < B[i]);
    if (kind === 'res3no') { if (!borrows) return [a, '-', b]; continue; }
    if (!borrows) continue;
    // válido si ningún paso pide prestado a un 0 (sería préstamo en cadena)
    const { steps } = Columna.plan(a, b, '-');
    if (steps.every(st => st.expect >= 0 && (st.kind !== 'borrow' || st.from >= 1))) return [a, '-', b];
  }
}
// Restas con ceros: hay que pedirle prestado a un 0 (el préstamo "baja" en cadena)
function mec0(kind) {
  for (;;) {
    let a, b;
    if (kind === 'one') { const u = ri(0, 8); a = ri(1, 9) * 100 + u; b = ri(10, a - 1); if (b % 10 <= u) continue; }   // 503 − 128
    else if (kind === 'two') { a = ri(1, 9) * 100; b = ri(11, a - 1); if (b % 10 === 0) continue; }                    // 500 − 247
    else return pick([() => mec0('one'), () => mec0('two'), () => mec3('res3')])();
    const { steps } = Columna.plan(a, b, '-');
    if (steps.some(st => st.chain)) return [a, '-', b];
  }
}
const CERO_EJEMPLOS = [[503, 128], [400, 156], [302, 175], [600, 248], [805, 269]];
// Razonados: historias con sumas y restas (contexto mexicano)
const NAMES = ['Mateo', 'Sofía', 'Diego', 'Valeria', 'Leo', 'Regina', 'Santi', 'Ximena', 'Tomás', 'Camila', 'Iker', 'Renata'];
const STORIES = [
  { op: '+', f: (n, a, b) => [`${n} tiene ${a} estampas. Su tío le regala ${b} más. ¿Cuántas estampas tiene ahora?`, 'estampas'] },
  { op: '+', f: (n, a, b) => [`En una caja hay ${a} crayolas y en otra caja hay ${b}. ¿Cuántas crayolas hay en total?`, 'crayolas'] },
  { op: '+', f: (n, a, b) => [`En la mañana se vendieron ${a} tamales y en la tarde ${b}. ¿Cuántos tamales se vendieron en todo el día?`, 'tamales'] },
  { op: '+', f: (n, a, b) => [`${n} leyó ${a} páginas el lunes y ${b} páginas el martes. ¿Cuántas páginas leyó en los dos días?`, 'páginas'] },
  { op: '+', f: (n, a, b) => [`En el camión escolar iban ${a} alumnos. En la siguiente parada se subieron ${b}. ¿Cuántos alumnos van ahora?`, 'alumnos'] },
  { op: '+', f: (n, a, b) => [`${n} ahorró ${a} pesos y su abuelita le dio ${b} pesos. ¿Cuántos pesos tiene en total?`, 'pesos'] },
  { op: '-', f: (n, a, b) => [`${n} tenía ${a} canicas y regaló ${b} a sus amigos. ¿Cuántas canicas le quedan?`, 'canicas'] },
  { op: '-', f: (n, a, b) => [`En el árbol había ${a} pajaritos. Se fueron volando ${b}. ¿Cuántos pajaritos quedan?`, 'pajaritos'] },
  { op: '-', f: (n, a, b) => [`${n} tiene ${a} pesos y compra una pelota de ${b} pesos. ¿Cuántos pesos le sobran?`, 'pesos'] },
  { op: '-', f: (n, a, b) => [`Una caja trae ${a} galletas. En el recreo se comieron ${b}. ¿Cuántas galletas quedan?`, 'galletas'] },
  { op: '-', f: (n, a, b, m) => [`${n} tiene ${a} carritos y ${m} tiene ${b}. ¿Cuántos carritos más tiene ${n}?`, 'carritos más'] },
  { op: '-', f: (n, a, b) => [`El libro tiene ${a} páginas. ${n} ya leyó ${b}. ¿Cuántas páginas le faltan por leer?`, 'páginas'] },
];
const KEYWORDS = { '+': 'Pistas de SUMA: "le regalan", "en total", "se subieron", "juntos", "ahora tiene más".', '-': 'Pistas de RESTA: "regaló", "se fueron", "le quedan", "le sobran", "le faltan", "¿cuántos más?".' };
function razonado() {
  const s = pick(STORIES), [n, m] = shuffle(NAMES);
  const [a, , b] = mec(s.op === '+' ? pick(['sumno', 'sum', 'sum']) : pick(['resno', 'res', 'res']));
  const [text, unit] = s.f(n, Math.max(a, b), Math.min(a, b), m);
  return { text, unit, op: s.op, a: Math.max(a, b), b: Math.min(a, b) };
}
// Cálculo mental
function mental(kind) {
  if (kind === 'diez') { const a = ri(2, 9), b = 10 - a; return pick([[a, '+', b], [10, '-', a]]); }
  if (kind === 'veinte') { const a = ri(3, 9), b = ri(3, 9); return pick([[a, '+', b], [a + b, '-', b]]); }
  if (kind === 'decenas') { const a = ri(1, 7) * 10, b = ri(1, 9 - a / 10) * 10; return pick([[a, '+', b], [a + b, '-', b]]); }
  if (kind === 'mas10') { const a = ri(11, 89); return pick([[a, '+', 10], [a, '-', 10], [a, '+', 20]]); }
  if (kind === 'dobles') { const a = ri(2, 10); return [a, '+', a]; }
  const a = ri(11, 89), b = ri(1, 9); return [a, '+', b];
}
const calc = ([a, op, b]) => op === '+' ? a + b : a - b;
const sign = op => op === '+' ? '+' : '−';
const word = op => op === '+' ? 'más' : 'menos';

/* ============================================================
   TEMAS
   ============================================================ */
const SECTIONS = [
  { id: 'mecanizados', name: '🧮 Mecanizados', es: 'Sumas y restas en columna, de derecha a izquierda.' },
  { id: 'razonados', name: '🧠 Razonados', es: 'Lee el problema, decide si es suma o resta y resuélvelo.' },
  { id: 'mental', name: '⚡ Cálculo mental', es: 'Contesta rápido, sin hacer la cuenta en columna.' },
  { id: 'ceros', name: '0️⃣ Restas con ceros', es: 'Cuando hay que pedirle prestado a un 0 (como 503 − 128). Primero miren juntos "Mira cómo se hace".' },
];
const TOPICS = [
  { id: 'sumno', sec: 'mecanizados', t: 'Sumas sin llevar', s: 'Para calentar', e: '➕', c: '#0ea5e9', kind: 'col', gen: () => mec('sumno') },
  { id: 'sum', sec: 'mecanizados', t: 'Sumas llevando', s: '"Llevo 1" a las decenas', e: '🔼', c: '#3b82f6', kind: 'col', gen: () => mec('sum') },
  { id: 'sum100', sec: 'mecanizados', t: 'Sumas que pasan de 100', s: 'Ej. 85 + 25 = 110', e: '💯', c: '#6366f1', kind: 'col', gen: () => mec('sum100') },
  { id: 'resno', sec: 'mecanizados', t: 'Restas sin pedir', s: 'Arriba hay más', e: '➖', c: '#14b8a6', kind: 'col', gen: () => mec('resno') },
  { id: 'res', sec: 'mecanizados', t: 'Restas pidiendo prestado', s: 'Pide 1 decena', e: '🔄', c: '#0d9488', kind: 'col', gen: () => mec('res') },
  { id: 'sum3no', sec: 'mecanizados', t: 'Sumas de 3 cifras', s: 'Sin llevar · C, D y U', e: '🧱', c: '#0284c7', kind: 'col', gen: () => mec3('sum3no') },
  { id: 'sum3', sec: 'mecanizados', t: 'Sumas de 3 cifras llevando', s: 'Ej. 358 + 267', e: '🏗️', c: '#1d4ed8', kind: 'col', gen: () => mec3('sum3') },
  { id: 'sum3k', sec: 'mecanizados', t: 'Sumas que pasan de 1000', s: 'Ej. 647 + 934 = 1581', e: '🚀', c: '#4338ca', kind: 'col', gen: () => mec3('sum3k') },
  { id: 'res3no', sec: 'mecanizados', t: 'Restas de 3 cifras', s: 'Sin pedir prestado', e: '📉', c: '#0f766e', kind: 'col', gen: () => mec3('res3no') },
  { id: 'res3', sec: 'mecanizados', t: 'Restas de 3 cifras pidiendo', s: 'Ej. 642 − 375', e: '🔁', c: '#115e59', kind: 'col', gen: () => mec3('res3') },
  { id: 'mezcla', sec: 'mecanizados', t: 'Mezcla', s: 'De todo un poco', e: '🎲', c: '#f97316', kind: 'col', gen: () => pick([() => mec(pick(['sum', 'sum', 'sumno', 'res', 'res', 'resno', 'sum100'])), () => mec3(pick(['sum3', 'res3', 'sum3no', 'res3no', 'sum3k']))])() },
  { id: 'razon', sec: 'razonados', t: 'Problemas', s: '¿Suma o resta?', e: '📖', c: '#8b5cf6', kind: 'razon', n: 6 },
  { id: 'm-diez', sec: 'mental', t: 'Amigos del 10', s: '3 + 7, 10 − 4…', e: '🔟', c: '#22c55e', kind: 'mental', gen: () => mental('diez') },
  { id: 'm-veinte', sec: 'mental', t: 'Hasta 20', s: '8 + 6, 15 − 7…', e: '✋', c: '#16a34a', kind: 'mental', gen: () => mental('veinte') },
  { id: 'm-dobles', sec: 'mental', t: 'Dobles', s: '6 + 6, 8 + 8…', e: '👯', c: '#65a30d', kind: 'mental', gen: () => mental('dobles') },
  { id: 'm-decenas', sec: 'mental', t: 'Decenas', s: '30 + 40, 80 − 20…', e: '🧱', c: '#ca8a04', kind: 'mental', gen: () => mental('decenas') },
  { id: 'm-reloj', sec: 'mental', t: 'Contra reloj', s: '¿Cuántas en 1 minuto?', e: '⏱️', c: '#dc2626', kind: 'reloj' },
  { id: 'm-mas10', sec: 'mental', t: 'Más 10 / menos 10', s: '47 + 10, 63 − 10…', e: '🪜', c: '#ea580c', kind: 'mental', gen: () => mental('mas10') },
  { id: 'ceros-demo', sec: 'ceros', t: 'Mira cómo se hace', s: 'Paso a paso, para explicarlo juntos', e: '👩‍🏫', c: '#7c3aed', kind: 'demo' },

const RELOJ_KEY = 'mi-examen-mate-reloj-v1', RELOJ_SEG = 60;
function relojBest() { try { return JSON.parse(localStorage.getItem(RELOJ_KEY)) || { best: 0 }; } catch (e) { return { best: 0 }; } }
let relojTimer = null;
function stopReloj() { if (relojTimer) { clearInterval(relojTimer); relojTimer = null; } }
function relojQ() { return mental(pick(['diez', 'veinte', 'veinte', 'dobles', 'decenas', 'mas10', 'mas10', 'x'])); }
function startReloj() {
  stopReloj();
  const rec = relojBest();
  screen('⏱️ Contra reloj', () => { stopReloj(); goHome(); },
    h('div', { class: 'card', style: { textAlign: 'center' } },
      h('div', { style: { fontSize: '72px' } }, '⏱️'),
      h('p', { style: { fontSize: '26px', margin: '6px 0' } }, `¿Cuántas cuentas puedes contestar en ${RELOJ_SEG} segundos?`),
      h('p', { style: { fontSize: '20px', color: '#64748b' } }, 'Escribe la respuesta con los números y toca ✔. Si te equivocas, no pasa nada: sigue con la próxima.'),
      h('p', { class: 'result-score', style: { fontSize: '30px' } }, '🏅 Tu récord: ' + rec.best),
      h('div', { class: 'actions' }, h('button', { class: 'big-btn green', style: { minWidth: '260px', minHeight: '90px', fontSize: '32px' }, onclick: runReloj }, '¡Empezar! ▶'))));
}
function runReloj() {
  stopReloj();
  const end = Date.now() + RELOJ_SEG * 1000;
  let ok = 0, bad = 0, q = null, ans = 0, val = '', locked = false, last = '';
  const misses = [];
  const clock = h('div', { class: 'reloj-clock' }, String(RELOJ_SEG));
  const bar = h('div', { class: 'progress' }, h('div', { style: { width: '100%', background: 'linear-gradient(90deg,#f97316,#facc15)' } }));
  const score = h('div', { class: 'reloj-score' }, '✅ 0');
  const line = h('div', { class: 'mental' });
  const fb = h('div', { class: 'fb' });
  function nextQ() {
    do { q = relojQ(); } while (q.join() === last); last = q.join();
    ans = calc(q); val = ''; locked = false; draw();
  }
  function draw() { line.className = 'mental'; line.innerHTML = ''; line.append(`${q[0]} ${sign(q[1])} ${q[2]} = `, h('span', { class: 'box' }, val || '?')); }
  function press(d) {
    if (locked) return;
    if (d === 'del') { val = val.slice(0, -1); draw(); return; }
    if (val.length >= 3) return;
    val += d; draw(); // se revisa al tocar ✔ (no se adivina por el número de cifras)
  }
  function check() {
    if (!val || locked) return;
    locked = true;
    if (+val === ans) { ok++; beep(true); line.className = 'mental ok'; fb.className = 'fb good'; fb.textContent = pick(['¡Bien! ⚡', '¡Rápido! 🚀', '¡Eso! ✅']); setTimeout(nextQ, 250); }
    else { bad++; beep(false); line.className = 'mental no'; fb.className = 'fb bad'; fb.textContent = `Era ${ans}`; misses.push(`${q[0]} ${sign(q[1])} ${q[2]} = ${ans}`); setTimeout(nextQ, 900); }
    score.textContent = '✅ ' + ok;
  }
  const pad = h('div', { class: 'pad reloj-pad' },
    ...'123456789'.split('').map(d => h('button', { onclick: () => press(d) }, d)),
    h('button', { class: 'del', onclick: () => press('del') }, '⌫'),
    h('button', { onclick: () => press('0') }, '0'),
    h('button', { class: 'chk', onclick: check }, '✔'));
  screen('⏱️ Contra reloj', () => { if (confirm('¿Salir? Se perderá esta ronda.')) { stopReloj(); goHome(); } },
    bar, h('div', { class: 'reloj-top' }, clock, score),
    h('div', { class: 'card', style: { textAlign: 'center' } }, line, fb, pad));
  nextQ();
  const tick = () => {
    const left = Math.max(0, end - Date.now());
    clock.textContent = String(Math.ceil(left / 1000));
    bar.firstChild.style.width = (left / (RELOJ_SEG * 10)) + '%';
    clock.classList.toggle('hurry', left <= 10000);

  };
  relojTimer = setInterval(tick, 200); tick();
}
function relojDone(ok, bad, misses) {
  const rec = relojBest(), nuevo = ok > rec.best;
  if (nuevo) { try { localStorage.setItem(RELOJ_KEY, JSON.stringify({ best: ok, fecha: Date.now() })); } catch (e) {} }
  saveBest('m-reloj', ok >= 15 ? 3 : ok >= 10 ? 2 : ok >= 5 ? 1 : 0);

      misses.length ? h('div', { class: 'review' }, h('b', null, 'Para repasar:'), h('ul', null, misses.slice(0, 8).map(r => h('li', null, r)))) : null),

const safeNext = u => (u && /^\.\.\/([a-z]+\/)?(\?[\w.,=&%-]*)?$/.test(u)) ? u : '../';
function startRepaso(secs, n, next, dia) {
  const pools = SECTIONS.filter(x => secs.includes(x.id)).map(x => shuffle(TOPICS.filter(t => t.sec === x.id && t.kind !== 'demo' && t.kind !== 'reloj')));
  if (!pools.length) return false;
  const order = [];
  for (let k = 0; order.length < n; k++) { const pool = pools[k % pools.length]; order.push(pool[Math.floor(k / pools.length) % pool.length]); }
  let j = 0;
  const last = next === '../';
  runSet({ id: 'repaso', title: '📅 Repaso' + (dia ? ' para el ' + dia : ''), total: n, exam: false,
    next: () => itemFor(order[j++ % order.length]), again: () => startRepaso(secs, n, next, dia),
    after: { next: () => { location.href = next; }, label: last ? '🏁 Terminé el repaso' : 'Seguir con el repaso ➜' } });

}
