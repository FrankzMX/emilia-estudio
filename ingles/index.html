<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Examen">
<meta name="theme-color" content="#3b82f6">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="../icon.svg">

<title>Mi Examen · Inglés 🌈</title>
<style>
:root{
  --purple:#3b82f6; --pink:#14b8a6; --orange:#ff9800; --green:#22c55e; --red:#ef4444;
  --blue:#2196f3; --yellow:#ffd54f; --ink:#1e293b; --card:#ffffff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
html{min-height:100%; background:#e3e9ff linear-gradient(160deg,#e0f2fe 0%,#e3e9ff 50%,#dcfce7 100%) no-repeat; background-size:100% 100%;}
body{
  min-height:100vh; background:transparent;
  font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS","Segoe UI",sans-serif;
  color:var(--ink);
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit; cursor:pointer; touch-action:manipulation;}
#app{min-height:100vh; display:flex; flex-direction:column;}
header{
  display:flex; align-items:center; gap:12px; padding:12px 18px;
  padding-top:max(12px, env(safe-area-inset-top));
}
header h1{flex:1; margin:0; font-size:28px; text-align:center;}
.iconbtn{
  min-width:64px; height:64px; border:none; border-radius:20px; background:#fff;
  font-size:30px; box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.iconbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12);}
main{flex:1; width:100%; max-width:960px; margin:0 auto; padding:8px 18px 28px; padding-bottom:max(28px, env(safe-area-inset-bottom));}
.card{background:var(--card); border-radius:28px; padding:24px 28px; box-shadow:0 8px 24px rgba(60,40,120,.12); margin-bottom:18px;}
.big-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:72px; padding:0 34px; border:none; border-radius:24px; font-size:28px; font-weight:bold;
  color:#fff; background:var(--purple); box-shadow:0 6px 0 rgba(0,0,0,.18);
}
.big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.big-btn.green{background:var(--green);} .big-btn.orange{background:var(--orange);} .big-btn.pink{background:var(--pink);} .big-btn.blue{background:var(--blue);}
.big-btn.yellow{background:var(--yellow); color:var(--ink); font-size:24px; min-height:64px; padding:0 24px;}
.big-btn:disabled{opacity:.4;}
.center{text-align:center;}
.row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}

/* Home */
.hello{font-size:24px; text-align:center; margin:0 0 14px;}
.section-head{display:flex; align-items:center; gap:12px; margin:26px 4px 10px; flex-wrap:wrap;}
.section-head h2{margin:0; font-size:28px; flex:1;}
.section-head h2 small{font-size:18px; color:#64748b; font-weight:normal;}
.sec-exam{border:none; border-radius:18px; padding:10px 16px; min-height:54px; font-size:19px; font-weight:bold; background:#fff; color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.1);}
.sec-exam:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.1);}
.topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
.topic-card{
  border:none; border-radius:24px; padding:16px 18px; color:#fff; text-align:left; min-height:150px;
  box-shadow:0 7px 0 rgba(0,0,0,.15); display:flex; flex-direction:column; gap:4px;
}
.topic-card:active{transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
.topic-card .emo{font-size:40px;}
.topic-card .t{font-size:21px; font-weight:bold; line-height:1.15;}
.topic-card .s{font-size:15px; opacity:.95;}
.topic-card .stars{font-size:20px; margin-top:auto;}
.exam-card{background:linear-gradient(135deg,#ff9800,#14b8a6); width:100%; min-height:110px; flex-direction:row; align-items:center; gap:18px;}
.exam-card .emo{font-size:60px;} .exam-card .t{font-size:30px;} .exam-card .s{font-size:19px;}
.exam-card .stars{margin:0 0 0 auto; font-size:28px;}

/* Explain */
.explain p{font-size:23px; line-height:1.45; margin:10px 0;}
.explain .key{background:#fff3c4; border-radius:14px; padding:12px 16px; font-size:23px;}
.explain table{border-collapse:separate; border-spacing:8px; margin:0 auto; font-size:24px;}
.explain td{background:#f1f5f9; border-radius:14px; padding:10px 16px; text-align:center;}
.chips{display:flex; flex-wrap:wrap; gap:12px; margin:14px 0; justify-content:center;}
.chip{
  display:inline-flex; align-items:center; gap:8px; border:none; border-radius:18px; padding:12px 18px;
  font-size:24px; background:#eef2ff; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.08); text-align:left;
}
.chip:active{transform:translateY(2px);}
.chip .first{color:var(--pink); font-weight:bold; font-size:30px;}
.chip small{font-size:17px; color:#64748b;}
.abc{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0;}
.abc button{width:52px; height:52px; border:none; border-radius:14px; font-size:26px; font-weight:bold; color:#fff;}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.cat-box{border-radius:22px; padding:14px 16px;}
.cat-box h3{margin:0 0 6px; font-size:24px;}
.cat-box p{font-size:19px !important; margin:4px 0 !important;}
.cat-box .chips{justify-content:flex-start; margin:6px 0;}
.story-p{display:flex;gap:12px;align-items:flex-start;background:#fdf4ff;border-radius:18px;padding:10px 14px;margin:10px 0}
.story-p p{margin:0 !important;font-size:22px !important;line-height:1.5 !important;flex:1}
.story-e{font-size:34px}
.opts.one{grid-template-columns:1fr}
.good{color:var(--green); font-weight:bold;} .bad{color:var(--red); font-weight:bold; text-decoration:line-through;}
.vowel{color:var(--pink); font-weight:bold;}

/* Quiz */
.progress{height:18px; background:#fff; border-radius:12px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.progress > div{height:100%; background:linear-gradient(90deg,var(--green),#86efac); border-radius:12px; transition:width .4s;}
.qmeta{display:flex; justify-content:space-between; font-size:20px; margin:8px 4px 12px;}
.prompt{font-size:28px; font-weight:bold; text-align:center; margin:4px 0 8px;}
.sub{font-size:21px; text-align:center; color:#64748b; margin-bottom:10px;}
.bigshow{font-size:96px; text-align:center; line-height:1.1; margin:6px 0;}
.bigword{font-size:40px; text-align:center; font-weight:bold; margin:4px 0 12px;}
.showsentence{font-size:32px; text-align:center; background:#f1f5f9; border-radius:18px; padding:14px 18px; margin:8px 0; line-height:1.4;}
.visual{display:flex; justify-content:center; margin:8px 0; overflow-x:auto;}
.visual svg{max-width:100%; height:auto;}
.speak{
  width:72px; height:72px; border-radius:50%; border:none; font-size:36px; background:var(--yellow);
  box-shadow:0 5px 0 rgba(0,0,0,.15); vertical-align:middle;
}
.speak:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
.speak.small{width:52px; height:52px; font-size:26px;}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:14px;}
.opts.four{grid-template-columns:1fr 1fr;}
.opts.two{grid-template-columns:1fr 1fr;}
.opts.three{grid-template-columns:1fr 1fr 1fr;}
.opt{
  min-height:88px; border:4px solid transparent; border-radius:24px; background:#f1f5f9; font-size:28px; color:var(--ink);
  box-shadow:0 6px 0 rgba(0,0,0,.1); padding:10px 14px; display:flex; align-items:center; justify-content:center; gap:12px;
}
.opt:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.1);}
.opt .oe{font-size:44px;}
.opt.correct{background:#dcfce7; border-color:var(--green);}
.opt.wrong{background:#fee2e2; border-color:var(--red);}
.opt:disabled{color:var(--ink);}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pop .35s;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* Word shape (letter boxes) */
.shape{display:flex; gap:5px; justify-content:center; height:80px; margin:6px 0;}
.shape span{width:40px; border:4px solid var(--purple); border-radius:6px; background:#f1f5f9; display:block;}
.shape .T{height:54px; margin-top:0;} .shape .S{height:28px; margin-top:26px;} .shape .L{height:54px; margin-top:26px;}

/* Order */
.slots{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; min-height:96px; padding:14px; border:4px dashed #bfdbfe; border-radius:24px; background:#f8fafc; margin:10px 0;}
.pool{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:90px; padding:10px;}
.tile{
  min-width:72px; height:76px; padding:0 18px; border:none; border-radius:20px; font-size:30px; font-weight:bold; color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.18); display:inline-flex; align-items:center; gap:6px;
}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.tile .num{font-size:16px; background:rgba(255,255,255,.35); border-radius:10px; padding:2px 7px;}
.tile.ok{outline:5px solid var(--green);} .tile.no{outline:5px solid var(--red);}
.slot-hint{color:#94a3b8; font-size:22px; align-self:center;}
.suffix{font-size:48px; font-weight:bold; color:var(--purple);}

/* Type */
.typebox{display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:10px;}
.typebox input{
  width:100%; max-width:760px; font-size:34px; padding:16px 20px; border-radius:20px; border:4px solid #bfdbfe;
  font-family:inherit; text-align:center; color:var(--ink); -webkit-user-select:text; user-select:text;
}
.typebox input:focus{outline:none; border-color:var(--purple);}
.hint{font-size:26px; letter-spacing:4px; text-align:center; color:var(--purple);}
.wrongsentence{font-size:30px; text-align:center; background:#fff7ed; border-radius:18px; padding:14px; margin:8px 0;}

/* Feedback */
.feedback{margin-top:18px; border-radius:24px; padding:16px 20px; font-size:26px; text-align:center; display:none;}
.feedback.show{display:block;}
.feedback.ok{background:#dcfce7; color:#166534;}
.feedback.no{background:#ffedd5; color:#9a3412;}
.feedback .answer{font-weight:bold; font-size:28px;}
.actions{display:flex; justify-content:center; gap:14px; margin-top:16px; flex-wrap:wrap;}

/* Results */
.result-stars{font-size:88px; text-align:center; letter-spacing:10px;}
.result-score{font-size:40px; text-align:center; font-weight:bold;}
.confetti{position:fixed; top:-60px; font-size:40px; pointer-events:none; animation:fall linear forwards; z-index:50;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
.review{font-size:20px;} .review li{margin:6px 0;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:14px 22px; border-radius:18px; font-size:20px; z-index:60;}
@media (max-width:700px){ .cat-grid{grid-template-columns:1fr;} .opt{font-size:22px;} .exam-card .t{font-size:24px;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ============================================================
   UTILIDADES
   ============================================================ */
const $app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sample = (a, n) => shuffle(a).slice(0, n);
const TILE_COLORS = ['#3b82f6','#14b8a6','#ff9800','#2196f3','#22c55e','#06b6d4','#00acc1','#8e24aa','#f4511e'];
const cap = s => s[0].toUpperCase() + s.slice(1);
const blankWord = (sentence, w) => sentence.replace(new RegExp('\\b' + w + '\\b', 'i'), '_____');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

/* ---------- Voz (Web Speech API) ---------- */
let enVoice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v => v.lang === 'en-US' && /samantha|google us|aria|jenny/i.test(v.name))
         || vs.find(v => v.lang === 'en-US') || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate) {
  if (!('speechSynthesis' in window)) { toast('Este navegador no puede leer en voz alta 😕'); return; }
  if (window.Voz) { Voz.speak(text, { lang: 'en', rate }); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate || 0.8; u.pitch = 1.1;
  if (enVoice) u.voice = enVoice;
  speechSynthesis.speak(u);
}
const speakBtn = (text, small) => h('button', { class: 'speak' + (small ? ' small' : ''), 'aria-label': 'Escuchar', onclick: e => { e.stopPropagation(); speak(text); } }, '🔊');
const sayChip = (label, text, extra) => h('button', { class: 'chip', onclick: () => speak(text || label) }, label, extra ? h('small', null, ' ' + extra) : null);

/* ---------- Sonidos cortos (Web Audio, sin archivos) ---------- */
let actx = null;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [660, 880, 1175] : [300, 220];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.1;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) { /* sin sonido */ }
}
function toast(msg) { const t = h('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2200); }
function confetti(n = 30) {
  const em = ['🎉','⭐','🌈','👍','✨','🚀','🎈'];
  for (let i = 0; i < n; i++) {
    const c = h('div', { class: 'confetti', style: { left: Math.random() * 100 + 'vw', animationDuration: (2 + Math.random() * 2) + 's', animationDelay: Math.random() * 0.8 + 's' } }, pick(em));
    document.body.append(c); setTimeout(() => c.remove(), 5000);
  }
}
const PRAISE = ['¡Muy bien! 🎉', '¡Excelente! 🌟', '¡Súper! 💪', '¡Lo lograste! 🥳', '¡Genial! 🚀', '¡Perfecto! ✨'];
const TRY_AGAIN = ['¡Casi! Intenta otra vez 💪', 'Uy, todavía no. ¡Tú puedes! 🌈', 'Mmm… piénsalo otra vez 🤔'];

/* ---------- Progreso guardado ---------- */
const STORE_KEY = 'mi-examen-ingles-v1';
const progress = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } })();
function saveBest(id, stars) { if ((progress[id] || 0) < stars) { progress[id] = stars; try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} } }
const starsFor = (score, total) => { const p = total ? score / total : 0; return p >= 0.9 ? 3 : p >= 0.7 ? 2 : p >= 0.4 ? 1 : 0; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);

/* ============================================================
   DATOS DE CONTENIDO
   ============================================================ */
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const WORD_SETS = [
  ['carrot', 'water', 'boy', 'plane', 'fish', 'lamp'],   // libro p66
  ['apple', 'dog', 'sun', 'moon', 'tree', 'egg'],
  ['zebra', 'hat', 'cake', 'rain', 'kite', 'nose'],
  ['ball', 'orange', 'pig', 'girl', 'juice', 'star'],
  ['milk', 'duck', 'frog', 'book', 'van', 'table'],
  ['house', 'lion', 'cup', 'window', 'rabbit', 'ice'],
  ['yellow', 'bear', 'pencil', 'snake', 'goat', 'nest'],
];
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const DAYS_ES = { Monday: 'lunes', Tuesday: 'martes', Wednesday: 'miércoles', Thursday: 'jueves', Friday: 'viernes', Saturday: 'sábado', Sunday: 'domingo' };
const MISSPELL = {
  Monday: ['Mondey', 'Munday', 'monday'], Tuesday: ['Tusday', 'Tuesdey', 'tuesday'], Wednesday: ['Wensday', 'Wednsday', 'wednesday'],
  Thursday: ['Thorsday', 'Thursdey', 'Tursday'], Friday: ['Fryday', 'Fraiday', 'friday'], Saturday: ['Saterday', 'Saturdey', 'saturday'], Sunday: ['Sonday', 'Sundey', 'sunday'],
};
const CATS = {
  person: { en: 'Person', es: 'persona', emoji: '🧑', color: '#14b8a6', bg: '#e0f2fe' },
  place:  { en: 'Place',  es: 'lugar',   emoji: '🏠', color: '#2196f3', bg: '#e0f0ff' },
  thing:  { en: 'Thing',  es: 'cosa',    emoji: '✏️', color: '#ff9800', bg: '#fff1dc' },
  animal: { en: 'Animal', es: 'animal',  emoji: '🐶', color: '#22c55e', bg: '#dcfce7' },
};
const NOUNS = [
  { w: 'teacher', e: '🧑‍🏫', c: 'person', book: 1 }, { w: 'brother', e: '👦', c: 'person', book: 1 }, { w: 'woman', e: '👩', c: 'person', book: 1 },
  { w: 'grandma', e: '👵', c: 'person' }, { w: 'girl', e: '👧', c: 'person' }, { w: 'baby', e: '👶', c: 'person' },
  { w: 'doctor', e: '🧑‍⚕️', c: 'person' }, { w: 'grandpa', e: '👴', c: 'person' }, { w: 'man', e: '👨', c: 'person' },
  { w: 'police officer', e: '👮', c: 'person' }, { w: 'cook', e: '🧑‍🍳', c: 'person' },
  { w: 'park', e: '🏞️', c: 'place', book: 1 }, { w: 'classroom', e: '🏫', c: 'place', book: 1 }, { w: 'kitchen', e: '🍳', c: 'place', book: 1 },
  { w: 'house', e: '🏠', c: 'place' }, { w: 'hospital', e: '🏥', c: 'place' }, { w: 'beach', e: '🏖️', c: 'place' },
  { w: 'store', e: '🏪', c: 'place' }, { w: 'castle', e: '🏰', c: 'place' }, { w: 'city', e: '🏙️', c: 'place' }, { w: 'church', e: '⛪', c: 'place' },
  { w: 'radio', e: '📻', c: 'thing', book: 1 }, { w: 'bike', e: '🚲', c: 'thing', book: 1 }, { w: 'knife', e: '🔪', c: 'thing', book: 1 },
  { w: 'pencil', e: '✏️', c: 'thing' }, { w: 'telephone', e: '☎️', c: 'thing' }, { w: 'book', e: '📖', c: 'thing' },
  { w: 'scissors', e: '✂️', c: 'thing' }, { w: 'ball', e: '⚽', c: 'thing' }, { w: 'clock', e: '⏰', c: 'thing' },
  { w: 'backpack', e: '🎒', c: 'thing' }, { w: 'crayon', e: '🖍️', c: 'thing' }, { w: 'car', e: '🚗', c: 'thing' },
  { w: 'rabbit', e: '🐰', c: 'animal', book: 1 }, { w: 'giraffe', e: '🦒', c: 'animal', book: 1 }, { w: 'lizard', e: '🦎', c: 'animal', book: 1 },

/* ---------- Dibujo SVG: clavo / tornillo junto a monedas (a escala) ---------- */
function measureSVG(items) { // items: [{obj:'nail'|'screw', n}]
  const D = 44, X0 = 14, rowH = 120;
  const maxN = Math.max(...items.map(i => i.n));
  const W = X0 * 2 + Math.max(maxN, 5) * D + 60, SC = 1.5;
  let out = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * SC}" height="${(items.length * rowH + 10) * SC}" viewBox="0 0 ${W} ${items.length * rowH + 10}">`;
  items.forEach((it, r) => {
    const y0 = r * rowH + 10, L = it.n * D, yc = y0 + 22, x1 = X0 + L;
    if (items.length > 1) out += `<text x="${x1 + 12}" y="${yc + 8}" font-size="22" font-family="sans-serif" fill="#1e293b">${it.label || ''}</text>`;
    if (it.obj === 'nail') {
      out += `<rect x="${X0}" y="${yc - 16}" width="8" height="32" rx="2" fill="#78909c"/>`;
      out += `<rect x="${X0 + 8}" y="${yc - 5}" width="${L - 26}" height="10" fill="#b0bec5" stroke="#78909c" stroke-width="1.5"/>`;
      out += `<polygon points="${x1 - 18},${yc - 5} ${x1},${yc} ${x1 - 18},${yc + 5}" fill="#90a4ae"/>`;
    } else {
      out += `<path d="M${X0} ${yc - 16} Q${X0 + 16} ${yc - 16} ${X0 + 16} ${yc} Q${X0 + 16} ${yc + 16} ${X0} ${yc + 16} Z" fill="#c9a227"/>`;
      out += `<line x1="${X0 + 3}" y1="${yc}" x2="${X0 + 13}" y2="${yc}" stroke="#7a5f00" stroke-width="3"/>`;
      out += `<rect x="${X0 + 16}" y="${yc - 6}" width="${L - 36}" height="12" fill="#e0c050" stroke="#a88a1c" stroke-width="1.5"/>`;
      for (let x = X0 + 22; x < x1 - 22; x += 8) out += `<line x1="${x}" y1="${yc - 6}" x2="${x + 5}" y2="${yc + 6}" stroke="#a88a1c" stroke-width="2"/>`;
      out += `<polygon points="${x1 - 20},${yc - 6} ${x1},${yc} ${x1 - 20},${yc + 6}" fill="#d4b13a"/>`;
    }
    const cy = y0 + 22 + 58;
    out += `<line x1="${X0}" y1="${yc - 20}" x2="${X0}" y2="${cy + 26}" stroke="#14b8a6" stroke-width="2" stroke-dasharray="5 4"/>`;
    out += `<line x1="${x1}" y1="${yc - 20}" x2="${x1}" y2="${cy + 26}" stroke="#14b8a6" stroke-width="2" stroke-dasharray="5 4"/>`;
    for (let i = 0; i < it.n; i++) {
      const cx = X0 + D / 2 + i * D;
      out += `<circle cx="${cx}" cy="${cy}" r="${D / 2 - 1}" fill="#ffd54f" stroke="#c79a00" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="${D / 2 - 8}" fill="none" stroke="#e6b800" stroke-width="2"/>`;
    }
  });
  return out + '</svg>';
}

const Q = {
  // ---------- Grammar: Alphabetical order ----------
  orderLetters(n = 5) {
    const letters = sample(ALPHABET, n);
    return { type: 'order', prompt: 'Ordena las letras como en el abecedario 🔤', sub: 'Toca las letras en orden: la primera va a la izquierda.', items: letters, answer: abcSort(letters), speakItems: true };

  orderWords(n = 6) {

  bookWords() {

  firstWord() {
    const words = sample(pick(WORD_SETS), 3);

  letterBetween() {

  letterAfter() {

  // ---------- Grammar: Capital letters (days) ----------
  pickCapitalDay() {

  spellDay(day) {

  // ---------- Grammar: Nouns ----------
  classify(item) {
    const n = item || pick(NOUNS);
    return { type: 'mc', layout: 'four', prompt: '¿Qué tipo de noun es? 🤔', big: n.e, word: n.w, speak: n.w, autoSpeak: true,

      explain: `${n.w} = ${CATS[n.c].es} (${CATS[n.c].en}).` };
  },
  whichIs() {
    const cat = pick(Object.keys(CATS));
    const right = pick(NOUNS.filter(n => n.c === cat));
    const wrong = sample(Object.keys(CATS).filter(k => k !== cat), 2).map(k => pick(NOUNS.filter(n => n.c === k)));
    return { type: 'mc', prompt: `¿Cuál es ${cat === 'animal' ? 'un' : 'una'} ${CATS[cat].es.toUpperCase()} (${CATS[cat].en})?`, speak: CATS[cat].en,

  },
  oddOne() {
    const cat = pick(Object.keys(CATS));
    const same = sample(NOUNS.filter(n => n.c === cat), 3);
    const odd = pick(NOUNS.filter(n => n.c !== cat));

  typeNoun() {

    return { type: 'type', prompt: 'Escribe el nombre en inglés ✍️', big: n.e, speak: w, hint: 'Letras: ' + shuffle(w.split('')).join(' '), answer: [w], caseSensitive: false, placeholder: 'Escribe aquí' };

      explain: it.a === 'an' ? `"${it.w}" empieza con vocal (${it.w[0]}) ➜ an ${it.w}` : `"${it.w}" empieza con consonante (${it.w[0]}) ➜ a ${it.w}` };
  },
  articlePlural() {
    const p = pick(PLURALS);
    return { type: 'mc', prompt: '¿a, an o nada? 🤔', sub: '¡Fíjate si es uno o son muchos!', big: p.e, word: 'I like ___ ' + p.w + '.', say: p.w, speak: 'I like ' + p.w + '.',
      options: [{ label: 'a', value: 'a' }, { label: 'an', value: 'an' }, { label: NADA, value: '' }], answer: '', explain: `"${p.w}" es plural (muchos): no lleva a ni an.` };
  },
  articleSentence() {
    const [s, a] = pick(ART_SENTENCES);
    return { type: 'mc', prompt: 'Completa la oración ✏️', show: s, speak: s.replace('___ ', a ? a + ' ' : ''),

  articlePhrase() {
    const it = pick(ART_ITEMS); const other = it.a === 'a' ? 'an' : 'a';
    const it2 = pick(ART_ITEMS.filter(x => x.a !== it.a));
    const good = `${it.a} ${it.w}`;
    return { type: 'mc', prompt: '¿Cuál está bien? ✅', options: textOpts(shuffle([good, `${other} ${it.w}`, `${it.a} ${it2.w}`])), answer: good, speak: good, noHint: true, explain: `Se dice "${good}".` };

  articleType() {
    const it = pick(ART_ITEMS);
    return { type: 'type', prompt: 'Escribe a o an ✍️', big: it.e, word: '___ ' + it.w, say: it.w, speak: it.a + ' ' + it.w, answer: [it.a], caseSensitive: false, placeholder: 'a / an', maxlength: 2 };

  // ---------- Grammar: Was / Were ----------
  wasWere(item) {
    const [s, a] = item || pick(WW);
    return { type: 'mc', layout: 'two', prompt: '¿was o were? 🕰️', show: s, speak: s.replace('___', a), options: textOpts(['was', 'were']), answer: a,
      explain: a === 'was' ? 'I / he / she / it (uno) ➜ was' : 'you / we / they (varios o tú) ➜ were' };
  },
  pronounWW() {
    const p = pick(Object.keys(PRONOUNS));
    return { type: 'mc', layout: 'two', prompt: '¿Qué va con esta palabra?', big: p, bigIsWord: true, say: p, speak: p + ' ' + PRONOUNS[p], options: textOpts(['was', 'were']), answer: PRONOUNS[p], explain: `${p} ${PRONOUNS[p]}` };
  },
  wwCorrect() {
    const [s, a] = pick(WW); const b = a === 'was' ? 'were' : 'was';
    const good = s.replace('___', a);
    return { type: 'mc', prompt: '¿Qué oración está bien? ✅', options: textOpts(shuffle([good, s.replace('___', b)])), answer: good, speak: good, noHint: true, explain: a === 'was' ? 'I / he / she / it ➜ was' : 'you / we / they ➜ were' };
  },
  wwType() {

/* ============================================================

   ============================================================ */
function screen(title, onBack, ...content) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $app.innerHTML = '';
  $app.append(
    h('header', null,
      onBack ? h('button', { class: 'iconbtn', 'aria-label': 'Inicio', onclick: onBack }, '🏠') : h('div', { style: { width: '64px' } }),
      h('h1', null, title), h('div', { style: { width: '64px' } })),
    h('main', null, ...content));
  window.scrollTo(0, 0);
}

let homeScroll = 0;
function goHome() { showHome(); window.scrollTo(0, homeScroll); }

function showHome() {
  const content = [
    h('div', { class: 'hello' }, '¡Hola! 👋 ¡Vamos a estudiar inglés! Elige un tema para practicar.'),
    h('button', { class: 'topic-card exam-card', onclick: () => startExam() },
      h('div', { class: 'emo' }, '🏆'), h('div', null, h('div', { class: 't' }, 'Mini examen'), h('div', { class: 's' }, '20 preguntas de TODOS los temas')),
      h('div', { class: 'stars' }, starStr(progress.exam || 0))),
  ];
  for (const sec of SECTIONS) {
    const topics = TOPICS.filter(t => t.section === sec.id);
    if (!topics.length) continue;
    content.push(h('div', { class: 'section-head', id: 'sec-' + sec.id },
      h('h2', null, sec.emoji + ' ' + sec.name + ' ', h('small', null, sec.es)),
      h('button', { class: 'sec-exam', onclick: () => startExam(sec.id) }, '📝 Examen de ' + sec.name + ' ' + starStr(progress['exam-' + sec.id] || 0))));
    content.push(h('div', { class: 'topics' }, topics.map(t => h('button', { class: 'topic-card', style: { background: t.color }, onclick: () => { homeScroll = window.scrollY; showExplain(t.id); } },
      h('div', { class: 'emo' }, t.emoji), h('div', { class: 't' }, t.title), h('div', { class: 's' }, t.es + ' · ' + t.pages),
      h('div', { class: 'stars' }, starStr(progress[t.id] || 0))))));
  }
  screen('Inglés · 2° 🌈', null, ...content);
}

function showExplain(id) {
  const t = TOPICS.find(x => x.id === id);
  screen(t.emoji + ' ' + t.title, goHome,
    h('div', { class: 'card' }, h('div', { class: 'sub' }, t.es + ' · Libro AMCO 2B1 ' + t.pages), t.explain()),
    h('div', { class: 'actions' }, h('button', { class: 'big-btn green', onclick: () => startPractice(id) }, '¡A practicar! ▶')));
}

function startPractice(id) {
  const i = TOPICS.findIndex(x => x.id === id), t = TOPICS[i], nx = TOPICS[i + 1];
  runQuiz({ title: t.emoji + ' ' + t.title, questions: t.practice(), mode: 'practice',
    onDone: (score, total, review) => showResults({ title: t.emoji + ' ' + t.title, score, total, review, id: t.id, again: () => startPractice(id),
      next: nx ? () => showExplain(nx.id) : () => startExam(), nextLabel: nx ? 'Siguiente tema ➜' : 'Mini examen 🏆' }) });
}

// Examen: toma preguntas de cada tema por turnos (round robin) para que todos salgan
function buildExam(topics, n) {
  const pools = shuffle(topics.map(t => shuffle(t.exam())));
  const qs = [];
  let added = true;
  while (qs.length < n && added) {
    added = false;
    for (const p of pools) { if (qs.length >= n) break; if (p.length) { qs.push(p.shift()); added = true; } }
  }
  return shuffle(qs);
}
function startExam(sectionId) {
  const sec = SECTIONS.find(s => s.id === sectionId);
  const topics = sec ? TOPICS.filter(t => t.section === sec.id) : TOPICS;
  const qs = buildExam(topics, sec ? 10 : 20);
  const title = sec ? `📝 Examen: ${sec.name}` : '🏆 Mini examen';
  runQuiz({ title, questions: qs, mode: 'exam',
    onDone: (score, total, review) => showResults({ title, score, total, review, id: sec ? 'exam-' + sec.id : 'exam', again: () => startExam(sectionId), exam: true }) });
}

function showResults({ title, score, total, review, id, again, next, nextLabel, exam }) {
  const stars = starsFor(score, total);
  saveBest(id, stars);
  const msg = stars === 3 ? '¡Increíble! Eres una estrella 🌟' : stars === 2 ? '¡Muy bien! Ya casi lo dominas 💪' : stars === 1 ? '¡Buen intento! Vamos a practicar un poquito más 🌈' : '¡No te rindas! Repasa la explicación y vuelve a intentar 💙';
  const mistakes = review.filter(r => !r.ok);
  screen(title, goHome,
    h('div', { class: 'card center' },
      h('div', { class: 'result-stars' }, starStr(stars)),
      h('div', { class: 'result-score' }, `${score} / ${total}`),
      h('p', { style: { fontSize: '26px' } }, msg),
      mistakes.length ? h('div', { class: 'review', style: { textAlign: 'left' } }, h('b', null, 'Para repasar:'),
        h('ul', null, mistakes.map(m => h('li', null, m.prompt + ' ➜ ', h('b', null, m.answer))))) : null),
    h('div', { class: 'actions' },
      h('button', { class: 'big-btn orange', onclick: again }, '🔁 Otra vez'),
      next ? h('button', { class: 'big-btn green', onclick: next }, nextLabel) : null,
      h('button', { class: 'big-btn blue', onclick: goHome }, '🏠 Inicio')));
  if (stars >= 2) { confetti(stars === 3 ? 40 : 20); beep(true); }
}

/* ============================================================
   MOTOR DE PREGUNTAS
   practice: puede reintentar (al 2º error se muestra la respuesta)
   exam: un solo intento, se muestra la respuesta correcta
   ============================================================ */
function runQuiz({ title, questions, mode, onDone }) {
  let idx = 0, score = 0;
  const review = [];
  const exam = mode === 'exam';
  const next = () => { idx++; idx < questions.length ? render() : onDone(score, questions.length, review); };

  function render() {
    const q = questions[idx];
    let tries = 0, done = false, given = ''; // given = lo que contestó (para "Errores para repasar")
    const fb = h('div', { class: 'feedback' });
    const actions = h('div', { class: 'actions' });
    const scoreEl = h('span', null, `⭐ ${score}`);
    const context = q.show ? ` «${q.show}»` : q.word ? ` ${q.big && !q.bigIsWord ? q.big + ' ' : ''}${q.word}` : q.bigIsWord ? ` (${q.big})` : q.wrongSentence ? ` «${q.wrongSentence}»` : '';

    function finish(ok, answerText) {
      done = true;
      if (ok && tries === 0) score++;
      review.push({ ok: ok && tries === 0, prompt: q.prompt + context, answer: answerText });
      scoreEl.textContent = `⭐ ${score}`;
      actions.innerHTML = '';
      if (q.speak) actions.append(h('button', { class: 'big-btn yellow', onclick: () => speak(q.speak) }, '🔊 Escuchar'));
      const nb = h('button', { class: 'big-btn green', onclick: next }, idx + 1 < questions.length ? 'Siguiente ➜' : 'Ver resultado 🏁');
      actions.append(nb);
      // Que "Siguiente" quede a la vista sin tener que hacer scroll
      setTimeout(() => { try { nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {} }, 150);
    }
    // Devuelve true si la pregunta terminó.
    function result(ok, answerText, extraMsg) {
      fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = '';
      if (ok) {
        beep(true);
        fb.append(h('div', null, pick(PRAISE)));
        if (tries > 0) fb.append(h('div', { style: { fontSize: '20px' } }, '(A la próxima, ¡al primer intento! 😉)'));
        if (q.speak) speak(q.speak);
        finish(true, answerText);
        return true;
      }
      beep(false);
      if (!exam && tries === 0) {
        tries++;
        fb.append(h('div', null, extraMsg || pick(TRY_AGAIN)));
        return false;
      }
      // "Errores para repasar": solo se guarda la respuesta final equivocada (no cada primer intento)
      if (window.Errores) Errores.log({ materia: 'Inglés', tema: title, pregunta: q.prompt + context, respuesta: given, correcta: answerText, modo: exam ? 'examen' : 'práctica',
        tipo: q.type, say: say || q.speak || null, numeric: !!(q.numeric || q.inputmode === 'numeric'), cs: !!q.caseSensitive, accent: !!q.accent,
        opciones: q.type === 'mc' ? q.options.map(o => [o.emoji, o.label].filter(Boolean).join(' ') || String(o.value)) : null,
        oi: q.type === 'mc' ? q.options.findIndex(o => o.value === q.answer) : -1,
        answers: q.type === 'type' ? q.answer.map(String) : null, col: q.type === 'column' ? { a: q.a, b: q.b, op: q.op } : null });
      tries++;
      fb.append(...[h('div', null, exam ? (extraMsg || 'Uy, esa no era 😅') : (extraMsg ? extraMsg : '')),
        h('div', null, 'La respuesta correcta es:'),
        h('div', { class: 'answer' }, answerText), q.explain ? h('div', { style: { fontSize: '20px', marginTop: '6px' } }, q.explain) : null].filter(Boolean));
      if (q.speak && !exam) speak(q.speak);
      finish(false, answerText);
      return true;
    }

    const body = h('div', { class: 'card' });
    // say = lo que lee la bocina ANTES de contestar (sin revelar la respuesta)
    const say = q.say !== undefined ? q.say : (q.noHint ? null : q.speak);
    const head = [h('div', { class: 'prompt' }, q.prompt), q.sub ? h('div', { class: 'sub' }, q.sub) : null];
    if (q.big) head.push(h('div', { class: 'bigshow', style: q.bigIsWord ? { fontSize: '64px' } : q.visual ? { fontSize: '56px' } : null }, q.big));
    if (q.visual) head.push(h('div', { class: 'visual', html: q.visual }));
    if (q.show) head.push(h('div', { class: 'showsentence' }, q.show));
    if (q.speakButtons) head.push(h('div', { class: 'row', style: { margin: '10px 0' } }, q.speakButtons.map(b => h('button', { class: 'big-btn yellow', onclick: () => speak(b.text, b.rate) }, b.label))));
    else if (q.word) head.push(h('div', { class: 'bigword' }, q.word + ' ', say ? speakBtn(say, true) : null));
    else if (say && ((q.type !== 'order' && !q.sentence && !q.show) || q.speakBtn || q.showSpeak)) head.push(h('div', { class: 'center' }, speakBtn(say)));
    body.append(...head.filter(Boolean));

    if (q.type === 'say') {
      // Escucha y repite: el iPad intenta escucharla (si el navegador puede) o ella confirma que lo dijo
      const status = h('div', { class: 'sub', style: { minHeight: '30px', marginTop: '10px' } });
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const target = q.word.toLowerCase();
      function listen() {
        if (done) return;
        let r;
        try { r = new SR(); } catch (e) { status.textContent = 'No puedo usar el micrófono aquí 😕 Toca "Ya lo dije".'; return; }
        r.lang = 'en-US'; r.maxAlternatives = 5; r.interimResults = false;
        status.textContent = '🎤 Te escucho… di la palabra';
        r.onresult = e => {
          const alts = [...e.results[0]].map(a => a.transcript.toLowerCase().trim());
          const ok = alts.some(t => t.split(/\W+/).includes(target) || t.replace(/\W/g, '') === target);
          status.textContent = `Escuché: "${alts[0]}"`;
          if (ok) result(true, q.word);
          else status.textContent += ' 🤔 Escúchala otra vez e inténtalo de nuevo.';
        };
        r.onerror = () => { status.textContent = 'No te escuché bien 😕 Intenta otra vez o toca "Ya lo dije".'; };
        try { r.start(); } catch (e) {}
      }
      body.append(
        h('div', { class: 'row' },
          h('button', { class: 'big-btn yellow', onclick: () => speak(q.word) }, '🔊 Escuchar'),
          h('button', { class: 'big-btn yellow', onclick: () => speak(q.word, 0.45) }, '🐢 Lento'),
          q.sentence ? h('button', { class: 'big-btn yellow', onclick: () => speak(q.sentence) }, '🗣️ En una oración') : null),
        h('div', { class: 'row', style: { marginTop: '16px' } },
          SR ? h('button', { class: 'big-btn pink', onclick: listen }, '🎤 Dilo y te escucho') : null,
          h('button', { class: 'big-btn green', onclick: () => { if (!done) result(true, q.word); } }, '✅ Ya lo dije')),
        status);
    }

    if (q.type === 'mc') {
      const opts = h('div', { class: 'opts' + (q.layout ? ' ' + q.layout : '') });
      const co = q.options.find(o => o.value === q.answer) || {};
      const correctLabel = [co.emoji, co.label].filter(Boolean).join(' ');
      q.options.forEach(o => {
        const b = h('button', { class: 'opt', onclick: () => {
          if (done || b.disabled) return;
          if (o.speak) speak(o.speak);
          given = [o.emoji, o.label].filter(Boolean).join(' ') || String(o.value);
          const ok = o.value === q.answer;
          b.classList.add(ok ? 'correct' : 'wrong', ok ? 'pop' : 'shake');
          const ended = result(ok, correctLabel);
          if (!ok) b.disabled = true;
          if (ended) opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.v === String(q.answer)) x.classList.add('correct'); });
        } }, o.emoji ? h('span', { class: 'oe' }, o.emoji) : null, o.label ? h('span', null, o.label, o.sub ? h('div', { style: { fontSize: '18px', color: '#64748b' } }, o.sub) : null) : null);
        b.dataset.v = String(o.value);
        opts.append(b);
      });
      body.append(opts);
    }

    if (q.type === 'order') {
      const pool = h('div', { class: 'pool' }), slots = h('div', { class: 'slots' });
      const tiles = shuffle(q.items.map((txt, i) => ({ txt, color: TILE_COLORS[i % TILE_COLORS.length] })));
      const sep = q.sep != null ? q.sep : ', ';
      const answerText = q.answer.join(sep) + (q.suffix || '');
      let placed = [];
      const check = h('button', { class: 'big-btn', disabled: true, onclick: doCheck }, 'Comprobar ✔');
      const reset = h('button', { class: 'big-btn orange', onclick: () => { if (!done) { placed = []; draw(); } } }, '↩ Borrar');
      function draw(marks) {
        pool.innerHTML = ''; slots.innerHTML = '';
        tiles.forEach(t => { if (!placed.includes(t)) pool.append(h('button', { class: 'tile', style: { background: t.color }, onclick: () => { if (done) return; placed.push(t); if (q.speakItems) speak(t.txt); draw(); } }, t.txt)); });
        if (!placed.length) slots.append(h('span', { class: 'slot-hint' }, 'Toca las fichas en orden 👇'));
        placed.forEach((t, i) => slots.append(h('button', { class: 'tile' + (marks ? (marks[i] ? ' ok' : ' no') : ''), style: { background: t.color }, onclick: () => { if (done) return; placed.splice(i, 1); draw(); } }, h('span', { class: 'num' }, i + 1), t.txt)));
        if (placed.length && q.suffix) slots.append(h('span', { class: 'suffix' }, q.suffix));
        check.disabled = placed.length !== tiles.length || done;
        if (!pool.children.length && !done) pool.append(h('span', { class: 'slot-hint' }, '¡Listo! Toca "Comprobar" ✔'));
      }
      function doCheck() {
        given = placed.map(t => t.txt).join(sep);
        const marks = placed.map((t, i) => t.txt === q.answer[i]);
        const ok = marks.every(Boolean);
        draw(marks);
        const ended = result(ok, answerText, ok ? null : '¡Casi! Las rojas no van ahí. Inténtalo otra vez 💪');
        if (!ended) setTimeout(() => { if (done) return; placed = placed.filter((t, i) => marks[i] && marks.slice(0, i).every(Boolean)); draw(); }, 1300);
        if (ended) { check.disabled = true; reset.disabled = true; }
      }
      draw();
      body.append(slots, pool);
      actions.append(reset, check);
    }

    if (q.type === 'type') {
      if (q.wrongSentence) body.append(h('div', { class: 'wrongsentence' }, '❌ ', q.wrongSentence));
      if (q.hint) body.append(h('div', { class: 'hint' }, q.hint));
      const input = h('input', { type: 'text', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', inputmode: q.inputmode || null, placeholder: q.placeholder || '', maxlength: q.maxlength || null, 'aria-label': 'Respuesta' });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') doCheck(); });
      const check = h('button', { class: 'big-btn', onclick: () => input.__guard ? input.__guard(doCheck) : doCheck() }, 'Comprobar ✔');
      const norm = s => { s = s.trim().replace(/\s+/g, ' ').replace(/[’]/g, "'"); if (q.sentence) s = s.replace(/[.!]+$/, '').trim(); return s; };
      function doCheck() {
        if (done) return;
        const raw = input.value.trim();
        given = raw;
        const v = norm(raw);
        if (!v) { input.focus(); return; }
        const match = q.answer.some(a => q.caseSensitive ? norm(a) === v : norm(a).toLowerCase() === v.toLowerCase());
        const missingPeriod = match && q.requirePeriod && !/\.$/.test(raw);
        const ok = match && !missingPeriod;
        const caseOnly = !match && q.answer.some(a => norm(a).toLowerCase() === v.toLowerCase());
        const shown = q.anyOf ? q.answer.slice(0, 5).join(', ') + '… (cualquier animal del bosque)' : q.sentence && !/\.$/.test(q.answer[0]) ? q.answer[0] + '.' : q.answer[0];
        const ended = result(ok, shown, missingPeriod ? '¡Casi! No olvides el punto (.) al final 🔵' : caseOnly ? '¡Casi! Revisa las MAYÚSCULAS 🔠' : null);
        input.classList.add(ok ? 'pop' : 'shake'); setTimeout(() => input.classList.remove('shake', 'pop'), 450);
        if (ended) { input.disabled = true; check.disabled = true; }
      }
      body.append(window.Escritura ? Escritura.pad({ q, input, lang: 'en', exam, submit: doCheck, typebox: h('div', { class: 'typebox' }, input) }) : h('div', { class: 'typebox' }, input));
      actions.append(check);
      setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) {} }, 50);
    }

    body.append(fb, actions);
    screen(title, () => { if (confirm('¿Salir? Se perderá el avance de esta práctica.')) goHome(); },
      h('div', { class: 'progress' }, h('div', { style: { width: (idx / questions.length * 100) + '%' } })),
      h('div', { class: 'qmeta' }, h('span', null, `Pregunta ${idx + 1} de ${questions.length}`), exam ? h('span', null, '🏆 Examen') : h('span', null, '🧠 Práctica'), scoreEl),
      body);
    // Se llama dentro del toque del botón (iPad necesita un toque para hablar)
    if (q.autoSpeak && q.speak) speak(q.speakButtons ? q.speakButtons[0].text : q.speak, q.speakButtons ? q.speakButtons[0].rate : null);
  }
  render();
}

showHome();
if (window.Escritura) Escritura.borrador();
/* ---------- 📅 Repaso para mañana (se abre desde el inicio) ----------
   ?repaso=reading,speaking&n=8&dia=miércoles&next=../otra-materia/?repaso=... */
const safeNext = u => (u && /^\.\.\/([a-z]+\/)?(\?[\w.,=&%-]*)?$/.test(u)) ? u : '../';
function startRepaso(secs, n, next, dia) {
  const topics = TOPICS.filter(t => secs.includes(t.section));
  if (!topics.length) return false;
  const title = '📅 Repaso' + (dia ? ' para el ' + dia : '');
  const last = next === '../';
  runQuiz({ title, questions: buildExam(topics, n), mode: 'practice',
    onDone: (score, total, review) => showResults({ title, score, total, review, id: 'repaso', again: () => startRepaso(secs, n, next, dia),
      next: () => { location.href = next; }, nextLabel: last ? '🏁 Terminé el repaso' : 'Seguir con el repaso ➜' }) });
  return true;
}
const RP = new URLSearchParams(location.search);
const tm = /^#tema-(.+)$/.exec(location.hash), tid = tm && decodeURIComponent(tm[1]);
if (RP.get('repaso')) { startRepaso(RP.get('repaso').split(','), Math.min(30, +RP.get('n') || 10), safeNext(RP.get('next')), RP.get('dia')); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
// Enlace directo a un tema (p. ej. #tema-talent, desde las estrellas del inicio)
else if (tid && TOPICS.some(t => t.id === tid)) showExplain(tid);
// Enlace directo a una sección desde el calendario (p. ej. #grammar)
else if (location.hash) { const el = document.getElementById('sec-' + location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); }
</script>
