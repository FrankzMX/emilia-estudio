<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Examen">
<meta name="theme-color" content="#ff7a45">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mi%20Examen%20-%20Espa%C3%B1ol%22%2C%22short_name%22%3A%22Mi%20Examen%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fff1e0%22%2C%22theme_color%22%3A%22%23ff7a45%22%7D">
<title>Mi Examen · Español 📚</title>
<style>
:root{
  --purple:#3b82f6; --pink:#14b8a6; --orange:#ff7a45; --green:#22c55e; --red:#ef4444;
  --blue:#2196f3; --yellow:#ffd54f; --ink:#1e293b; --card:#ffffff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;}
html{min-height:100%; background:#fff1e0 linear-gradient(160deg,#fff1e0 0%,#e0f2fe 50%,#e0f2fe 100%) no-repeat; background-size:100% 100%;}
body{
  min-height:100vh; background:transparent;
  font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS","Segoe UI",sans-serif;
  color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:manipulation; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; cursor:pointer; touch-action:manipulation; color:var(--ink);}
#app{min-height:100vh; display:flex; flex-direction:column;}
header{display:flex; align-items:center; gap:12px; padding:12px 18px; padding-top:max(12px, env(safe-area-inset-top));}
header h1{flex:1; margin:0; font-size:28px; text-align:center;}
.iconbtn{min-width:64px; height:64px; border:none; border-radius:20px; background:#fff; font-size:30px; box-shadow:0 4px 0 rgba(0,0,0,.12);}
.iconbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12);}
main{flex:1; width:100%; max-width:960px; margin:0 auto; padding:8px 18px 28px; padding-bottom:max(28px, env(safe-area-inset-bottom));}
.card{background:var(--card); border-radius:28px; padding:24px 28px; box-shadow:0 8px 24px rgba(120,60,40,.12); margin-bottom:18px;}
.big-btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:72px; padding:0 34px; border:none; border-radius:24px; font-size:28px; font-weight:bold; color:#fff; background:var(--purple); box-shadow:0 6px 0 rgba(0,0,0,.18);}
.big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.big-btn.green{background:var(--green);} .big-btn.orange{background:var(--orange);} .big-btn.pink{background:var(--pink);} .big-btn.blue{background:var(--blue);}
.big-btn.yellow{background:var(--yellow); color:var(--ink); font-size:24px; min-height:64px; padding:0 24px;}
.big-btn:disabled{opacity:.4;}
.center{text-align:center;}
.row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}

/* Inicio */
.hello{font-size:24px; text-align:center; margin:0 0 14px;}
.section-head{display:flex; align-items:center; gap:12px; margin:26px 4px 10px; flex-wrap:wrap;}
.section-head h2{margin:0; font-size:28px; flex:1;}
.section-head h2 small{font-size:18px; color:#64748b; font-weight:normal;}
.sec-exam{border:none; border-radius:18px; padding:10px 16px; min-height:54px; font-size:19px; font-weight:bold; background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.1);}
.sec-exam:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.1);}
.topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
.topic-card{position:relative; border:none; border-radius:24px; padding:16px 18px; color:#fff; text-align:left; min-height:150px; box-shadow:0 7px 0 rgba(0,0,0,.15); display:flex; flex-direction:column; gap:4px;}
.topic-card:active{transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
.topic-card .emo{font-size:40px;}
.topic-card .t{font-size:21px; font-weight:bold; line-height:1.15; color:#fff;}
.topic-card .s{font-size:15px; opacity:.95; color:#fff;}
.topic-card .stars{font-size:20px; margin-top:auto;}
.topic-card .badge{position:absolute; top:10px; right:10px; background:#fff; color:#d9480f; font-size:14px; font-weight:bold; border-radius:12px; padding:4px 8px; transform:rotate(4deg);}
.exam-card{background:linear-gradient(135deg,#ff9800,#14b8a6); width:100%; min-height:110px; flex-direction:row; align-items:center; gap:18px;}
.exam-card .emo{font-size:60px;} .exam-card .t{font-size:30px;} .exam-card .s{font-size:19px;}
.exam-card .stars{margin:0 0 0 auto; font-size:28px;}

/* Explicación */
.explain p{font-size:23px; line-height:1.45; margin:10px 0;}
.explain .key{background:#fff3c4; border-radius:14px; padding:12px 16px; font-size:23px;}
.explain table{border-collapse:separate; border-spacing:8px; margin:0 auto; font-size:24px;}
.explain th{font-size:28px; color:var(--pink);}
.explain td{background:#f1f5f9; border-radius:14px; padding:10px 16px; text-align:center;}
.chips{display:flex; flex-wrap:wrap; gap:12px; margin:14px 0; justify-content:center;}
.chip{display:inline-flex; align-items:center; gap:8px; border:none; border-radius:18px; padding:12px 18px; font-size:24px; background:#eef2ff; box-shadow:0 3px 0 rgba(0,0,0,.08); text-align:left;}
.chip:active{transform:translateY(2px);}
.chip small{font-size:17px; color:#64748b;}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.cat-grid.three{grid-template-columns:1fr 1fr 1fr;}
.cat-box{border-radius:22px; padding:14px 16px;}
.cat-box h3{margin:0 0 6px; font-size:24px;}
.cat-box p{font-size:19px !important; margin:4px 0 !important;}
.cat-box .chips{justify-content:flex-start; margin:6px 0;}
.good{color:#15803d; font-weight:bold;} .bad{color:var(--red); font-weight:bold; text-decoration:line-through;}
.hl-syl{color:var(--pink); font-weight:bold;}
.story{background:#f8f7ff; border-radius:16px; padding:10px 16px; font-size:20px !important; line-height:1.4;}
mark{background:#ffe066; border-radius:6px; padding:0 3px;}

/* Cartel */
.poster{position:relative; width:340px; max-width:100%; margin:8px auto; border-radius:14px; padding:14px 18px 16px 48px; border:6px solid; text-align:center; box-shadow:0 6px 0 rgba(0,0,0,.12);}
.poster .pp{position:relative; border:3px dashed transparent; border-radius:12px; padding:4px 6px; margin:4px 0;}
.poster .p-t{font-size:28px; font-weight:900; letter-spacing:1px; line-height:1.1;}
.poster .p-i{font-size:70px; line-height:1.1;}
.poster .p-x{font-size:19px; line-height:1.3;}
.poster .pp.hl{border-color:var(--pink); background:rgba(255,79,154,.12); animation:pulse 1s infinite alternate;}
.poster .arrow{position:absolute; left:-46px; top:50%; transform:translateY(-50%); font-size:34px;}
.poster .tag{position:absolute; left:-44px; top:50%; transform:translateY(-50%) rotate(-90deg); background:var(--ink); color:#fff; font-size:13px; font-weight:bold; border-radius:8px; padding:2px 6px; white-space:nowrap;}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,79,154,.5);}to{box-shadow:0 0 0 8px rgba(255,79,154,0);}}
.posters{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
.mini-poster{background:#e0f2fe; border:4px solid #0369a1; border-radius:12px; padding:10px 12px; width:250px; text-align:center; font-size:19px; font-weight:bold;}
.mini-poster .e{font-size:44px;}

/* Preguntas */
.progress{height:18px; background:#fff; border-radius:12px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.progress > div{height:100%; background:linear-gradient(90deg,var(--green),#86efac); border-radius:12px; transition:width .4s;}
.qmeta{display:flex; justify-content:space-between; font-size:20px; margin:8px 4px 12px;}
.prompt{font-size:28px; font-weight:bold; text-align:center; margin:4px 0 8px;}
.sub{font-size:21px; text-align:center; color:#64748b; margin-bottom:10px;}
.bigshow{font-size:96px; text-align:center; line-height:1.1; margin:6px 0;}
.bigword{font-size:44px; text-align:center; font-weight:bold; margin:4px 0 12px; letter-spacing:1px;}
.showsentence{font-size:28px; text-align:center; background:#f1f5f9; border-radius:18px; padding:14px 18px; margin:8px 0; line-height:1.4;}
.showsentence.left{text-align:left; font-size:24px;}
.visual{display:flex; justify-content:center; margin:8px 0;}
.speak{width:72px; height:72px; border-radius:50%; border:none; font-size:36px; background:var(--yellow); box-shadow:0 5px 0 rgba(0,0,0,.15); vertical-align:middle;}
.speak:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
.speak.small{width:52px; height:52px; font-size:26px;}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:14px;}
.opts.two{grid-template-columns:1fr 1fr;} .opts.three{grid-template-columns:1fr 1fr 1fr;} .opts.one{grid-template-columns:1fr;}
.opt{min-height:88px; border:4px solid transparent; border-radius:24px; background:#f1f5f9; font-size:26px; box-shadow:0 6px 0 rgba(0,0,0,.1); padding:10px 14px; display:flex; align-items:center; justify-content:center; gap:12px; line-height:1.25;}
.opt:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.1);}
.opt .oe{font-size:40px;}
.opt.correct{background:#dcfce7; border-color:var(--green);}
.opt.wrong{background:#fee2e2; border-color:var(--red);}
.opt:disabled{color:var(--ink);}
.passage{background:#fffaf0; border:3px solid #ffe0b2; border-radius:22px; padding:14px 18px; margin:0 0 14px; text-align:left;}
.passage-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.passage .ptitle{font-size:24px; font-weight:bold; color:#d9480f;}
.passage .pkind{display:inline-block; margin-left:10px; background:#ffe0b2; border-radius:12px; padding:2px 10px; font-size:17px; color:#8a4b12; vertical-align:middle;}
.passage .pnote{margin-top:10px; font-size:20px; font-weight:bold; color:#2e7d32;}
.passage .ptext{white-space:pre-line; font-size:22px; line-height:1.5;}
.big-btn.small-btn{min-height:52px; font-size:19px; padding:0 16px; border-radius:18px;}
.group-label{font-size:22px; font-weight:bold; color:#8a4b12; background:#fff3c4; border-radius:16px; padding:8px 16px; margin:6px 0 12px; display:inline-block;}
.think{background:#eef6ff; border:3px dashed #74a9ff; border-radius:22px; padding:16px 18px; margin-top:12px; text-align:center;}
.think .tlabel{font-size:22px; font-weight:bold; color:#1c64d6; margin-bottom:6px;}
.think .tsteps{font-size:20px; color:#555; margin-bottom:12px;}
.think .model{margin-top:14px; background:#fff; border-radius:16px; padding:12px 16px; font-size:23px; line-height:1.45; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.06);}
.calbox{background:#fff; border-radius:18px; padding:10px 12px; box-shadow:0 3px 0 rgba(0,0,0,.06); margin:6px;}
.caltitle{text-align:center; font-weight:bold; font-size:22px; color:var(--pink); margin-bottom:4px;}
table.cal{border-collapse:collapse; margin:0 auto; font-size:21px;}
table.cal th{font-size:15px; color:#64748b; padding:2px 6px;}
table.cal td{width:44px; height:38px; text-align:center; border-radius:10px;}
table.cal td.we{color:#d9480f;}
table.cal td.mk{background:#ffd43b; font-weight:bold; color:var(--ink);}
table.colop{border-collapse:collapse; font-size:56px; font-family:ui-monospace,Menlo,monospace; margin:6px 24px;}
table.colop td{width:46px; text-align:center; line-height:1.15;}
table.colop tr.line td{border-bottom:5px solid var(--ink);}
table.colop tr.ans td{height:40px;}
.clockcard{text-align:center; font-size:20px; background:#fff; border-radius:18px; padding:8px 12px;}
.tline{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:10px 0;}
.tstep{display:flex; flex-direction:column; align-items:center; background:#ede9fe; border-radius:14px; padding:8px 12px; font-size:19px; position:relative;}
.tstep b{font-size:22px; color:var(--purple);}
.tstep:not(:last-child)::after{content:'➜'; position:absolute; right:-14px; top:30%; color:#999;}
.coll{display:flex; flex-direction:column; gap:4px; font-size:30px; line-height:1.1; background:#fff; border-radius:16px; padding:10px 14px;}
.collpair{display:flex; gap:18px; flex-wrap:wrap; justify-content:center;}
.collpair>div{text-align:center; font-size:26px;}
.collpair .coll{font-size:24px;}
.blocks{display:flex; align-items:flex-end; gap:6px; flex-wrap:wrap; justify-content:center; background:#fff; border-radius:16px; padding:12px;}
.blocks .bc{width:80px; height:80px; background-color:#2196f3; background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px); background-size:8px 8px; border:2px solid #1565c0;}
.blocks .bd{width:10px; height:80px; background-color:#22c55e; background-image:linear-gradient(#fff 1px,transparent 1px); background-size:8px 8px; border:1px solid #15803d;}
.blocks .bu{width:10px; height:10px; background:#ff7a45; border:1px solid #c2410c;}
table.cdu{border-collapse:separate; border-spacing:6px; font-size:36px; margin:6px auto;}
table.cdu th{background:#ede9fe; color:var(--purple); border-radius:10px; width:70px;}
table.cdu td{background:#fff; border:3px solid #bfdbfe; border-radius:12px; width:70px; height:56px; text-align:center; font-weight:bold;}
.opts.one .opt{min-height:70px; font-size:23px; justify-content:flex-start; text-align:left;}

.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pop .35s;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* Ordenar */
.slots{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; min-height:96px; padding:14px; border:4px dashed #bfdbfe; border-radius:24px; background:#f8fafc; margin:10px 0;}
.pool{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:90px; padding:10px;}
.tile{min-width:72px; min-height:76px; padding:0 18px; border:none; border-radius:20px; font-size:30px; font-weight:bold; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.18); display:inline-flex; align-items:center; gap:8px;}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.tile .num{font-size:16px; background:rgba(255,255,255,.35); border-radius:10px; padding:2px 7px;}
.tile.ok{outline:5px solid var(--green);} .tile.no{outline:5px solid var(--red);}
.long .slots, .long .pool{flex-direction:column; align-items:stretch;}
.long .tile{font-size:20px; font-weight:normal; text-align:left; padding:12px 16px; line-height:1.35; width:100%;}
.slot-hint{color:#94a3b8; font-size:22px; align-self:center;}
.suffix{font-size:48px; font-weight:bold; color:var(--purple);}

/* Tocar palabras */
.taps{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:14px 0; padding:14px; background:#f8fafc; border-radius:22px;}
.wtok{min-height:64px; min-width:56px; padding:6px 16px; border:4px solid #d9d6ff; border-radius:18px; background:#fff; font-size:30px; box-shadow:0 4px 0 rgba(0,0,0,.08);}
.taps.chipsmode .wtok{font-size:24px;}
.wtok.sel{background:#fff3c4; border-color:var(--orange);}
.wtok.ok{background:#dcfce7; border-color:var(--green);}
.wtok.no{background:#fee2e2; border-color:var(--red);}
.wtok.miss{border-color:var(--green); border-style:dashed;}

/* Escribir */
.typebox{display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:10px;}
.typebox input{width:100%; max-width:760px; font-size:38px; padding:16px 20px; border-radius:20px; border:4px solid #bfdbfe; font-family:inherit; text-align:center; color:var(--ink); -webkit-user-select:text; user-select:text; letter-spacing:1px;}
.typebox input:focus{outline:none; border-color:var(--purple);}
.hint{font-size:28px; letter-spacing:6px; text-align:center; color:var(--purple);}

/* Retroalimentación */
.feedback{margin-top:18px; border-radius:24px; padding:16px 20px; font-size:26px; text-align:center; display:none;}
.feedback.show{display:block;}
.feedback.ok{background:#dcfce7; color:#166534;}
.feedback.no{background:#ffedd5; color:#9a3412;}
.feedback .answer{font-weight:bold; font-size:28px;}
.feedback .why{font-size:20px; margin-top:6px;}
.actions{display:flex; justify-content:center; gap:14px; margin-top:16px; flex-wrap:wrap;}

/* Resultados */
.result-stars{font-size:88px; text-align:center; letter-spacing:10px;}
.result-score{font-size:40px; text-align:center; font-weight:bold;}
.confetti{position:fixed; top:-60px; font-size:40px; pointer-events:none; animation:fall linear forwards; z-index:50;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
.review{font-size:20px;} .review li{margin:6px 0;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:14px 22px; border-radius:18px; font-size:20px; z-index:60;}
@media (max-width:700px){ .cat-grid,.cat-grid.three{grid-template-columns:1fr;} .opt{font-size:21px;} .opts.three{grid-template-columns:1fr;} .exam-card .t{font-size:24px;} }
</style>
</head>
<body>
<div id="app"></div>
<script src="../comun/voz.js"></script>
<script src="../comun/columna.js"></script>
<script src="../comun/escritura.js"></script>
<script src="../comun/errores.js"></script>
<script>
"use strict";
/* ============================================================
   UTILIDADES
   ============================================================ */
const $app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sample = (a, n) => shuffle(a).slice(0, n);
const TILE_COLORS = ['#3b82f6','#14b8a6','#ff7a45','#2196f3','#22c55e','#06b6d4','#00acc1','#8e24aa','#f4511e'];
const stripEmoji = s => String(s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu, '').replace(/_{2,}/g, ' … ').replace(/\s+/g, ' ').trim();
const noAccent = s => s.normalize('NFD').replace(/[\u0300\u0301\u0308]/g, '').normalize('NFC');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

/* ---------- Voz en español (Web Speech API) ---------- */
let esVoice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const L = v => (v.lang || '').replace('_', '-').toLowerCase();
  esVoice = vs.find(v => L(v) === 'es-mx' && /paulina|google|sabina|dalia/i.test(v.name))
         || vs.find(v => L(v) === 'es-mx') || vs.find(v => L(v) === 'es-us') || vs.find(v => L(v) === 'es-419')
         || vs.find(v => L(v).startsWith('es')) || null;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate) {
  if (!('speechSynthesis' in window)) { toast('Este navegador no puede leer en voz alta 😕'); return; }
  const t = stripEmoji(text);
  if (!t) return;
  if (window.Voz) { Voz.speak(t, { lang: 'es', rate }); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = esVoice ? esVoice.lang : 'es-MX'; u.rate = rate || 0.85; u.pitch = 1.05;
  if (esVoice) u.voice = esVoice;
  speechSynthesis.speak(u);
}
const speakBtn = (text, small, rate) => h('button', { class: 'speak' + (small ? ' small' : ''), 'aria-label': 'Escuchar', onclick: e => { e.stopPropagation(); speak(text, rate); } }, '🔊');
const sayChip = (label, text, extra) => h('button', { class: 'chip', onclick: () => speak(text || label) }, label, extra ? h('small', null, ' ' + extra) : null);

/* ---------- Sonidos cortos ---------- */
let actx = null;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [660, 880, 1175] : [300, 220];
    notes.forEach((f, i) => {

  autorType: () => ({ type: 'type', prompt: 'Completa ✍️', show: 'La persona que escribió un texto se llama el _____.', answer: ['autor'], accent: true, placeholder: 'Escribe la palabra', explain: 'au-tor: termina en -or (¡no "auter"!).' }),
  whyText: () => pick([

  libClassify: () => mc('En la biblioteca, ¿cómo se clasifican los libros?', 'Según el tipo de texto o el tema', ['Por el color de la portada', 'Por el número de páginas', 'Por el precio'], { layout: 'one' }),
  dicDef: () => mc('¿Qué es el diccionario? 📕', 'Un libro informativo y de consulta que explica el significado de las palabras', ['Un cuento con personajes y un problema', 'Un cartel con imágenes grandes', 'Una credencial para llevarte libros'], { layout: 'one' }),
  dicOrder: () => mc('¿Cómo están acomodadas las palabras en el diccionario? 🔤', 'En orden alfabético (a, b, c…)', ['De la más corta a la más larga', 'Por colores', 'Como quiera el autor'], { layout: 'one' }),
  dicType: () => mc('El diccionario es un texto…', 'informativo', ['literario'], { layout: 'two', explain: 'Es informativo y de consulta: lo usamos para buscar qué significa una palabra.' }),
  abcOrder: n => { const ws = sample(ABC_POOL, n || 4); const ans = esSort(ws); return { type: 'order', prompt: 'Ordena como en el diccionario 🔤', sub: 'Mira la PRIMERA letra: a, b, c, d…', items: ws, answer: ans, sep: ', ', speakItems: true, key: 'abc' + ws.join() }; },
  abcFirst: () => { const ws = sample(ABC_POOL, 3); const a = esSort(ws)[0]; return mc('¿Qué palabra aparece PRIMERO en el diccionario? 🥇', a, ws.filter(x => x !== a), { layout: 'three', key: 'af' + ws.join(), explain: `"${a}" empieza con ${a[0]}, que va antes en el abecedario.` }); },
  credFor: () => mc('¿Para qué sirve la credencial de la biblioteca? 🪪', 'Para tener mejor control de los libros', ['Para entrar al recreo', 'Para comprar dulces', 'Para escribir cuentos'], { layout: 'one', explain: 'Si te llevas un libro a casa o lo lees en el salón, dejas tu credencial.' }),
  credLeave: () => mc('Si quieres llevar un libro a casa, ¿qué dejas? 📚', { label: 'Tu credencial', emoji: '🪪', value: 'cred' }, [{ label: 'Tu mochila', emoji: '🎒', value: 'm' }, { label: 'Tu lonchera', emoji: '🍱', value: 'l' }, { label: 'Tu suéter', emoji: '🧥', value: 's' }], { layout: 'two' }),

  /* ---------- El cartel ---------- */
  cartelDef: () => mc('¿Qué es un cartel? 🪧', 'Una lámina grande con imágenes y textos breves que da información o anuncia algo', ['Un libro con historias largas', 'Un libro con palabras en orden alfabético', 'Una carta para un amigo'], { layout: 'one' }),
  cartelPurpose: ex => { ex = ex || pick(PURP_EX); return mc('Este cartel sirve para… 🪧', PURPOSES[ex[1]], sample(NOT_PURPOSES, 2), { layout: 'one', show: ex[0], key: 'cp-' + ex[0], explain: 'Los carteles sirven para: dar a conocer un evento, promover hábitos positivos o crear conciencia.' }); },
  cartelPurposeWhich: () => mc('¿Para qué se usan los carteles? 🤔', pick(PURPOSES), sample(NOT_PURPOSES, 2), { layout: 'one', key: 'cpw' + Math.random() }),
  cartelPurposeTap: () => tapChips(PURPOSES, sample(NOT_PURPOSES, 3), { prompt: 'Toca los 3 usos del cartel 👆', sub: '¿Para qué sirve un cartel?' }),

  cartelCharTap: () => tapChips(CHARS, sample(NOT_CHARS, 3), { prompt: 'Toca las 4 características del cartel 👆' }),
  cartelTextos: () => mc('¿Cómo son los textos de un cartel? 📝', 'Breves (cortos) y fáciles de leer', ['Muy largos, con mucha letra', 'En letra muy chiquita', 'No tiene textos'], { layout: 'one' }),
  cartelPart: (pi, part) => { const p = pi != null ? POSTERS[pi] : pick(POSTERS); part = part || pick(['titulo', 'imagen', 'texto']);

  cartelMsg: () => { const ex = pick(P18); return mc('¿Cuál es el mensaje de este cartel? (p. 18)', { label: 'Cuidar el agua', emoji: '💧', value: 'agua' }, [{ label: 'Comer sano', emoji: '🥦', value: 'c' }, { label: 'Leer más libros', emoji: '📚', value: 'l' }, { label: 'Hacer ejercicio', emoji: '⚽', value: 'e' }], { layout: 'two', show: ex[0] + ' ' + ex[1], key: 'msg-' + ex[1] }); },
  cartelWhyImg: () => mc('¿Por qué los carteles usan imágenes? 🖼️', 'Para llamar nuestra atención y entender mejor el mensaje', ['Para que el cartel pese más', 'Para no tener que poner título', 'Porque los carteles son cuentos'], { layout: 'one', explain: 'Sin imágenes no entenderíamos igual el mensaje.' }),
  cartelTitle: () => mc('¿Cuál frase es mejor para el TÍTULO de un cartel? 🔤', pick(['¡Cuida el agua! 💧', '¡No tires basura! 🚯', '¡Cuida los árboles! 🌳', '¡Adopta, no abandones! 🐶']), ['Había una vez una gota de agua que vivía en un río muy lejano y un día se fue…', 'capítulo uno'], { layout: 'one', key: 'ct' + Math.random(), explain: 'El título de un cartel es corto, con letras grandes que llaman la atención.' }),
  cartelTheme: () => mc('¿Qué tema sirve para un cartel que crea conciencia? 🌎', pick(['Cuidar el agua', 'Cuidar el medio ambiente', 'No tirar basura', 'No maltratar a los animales']), ['Mi cuento de hadas favorito', 'La lista de mis juguetes'], { layout: 'one', key: 'th' + Math.random() }),

  /* ---------- Ortografía: k ---------- */
  kSpell: it => { it = it || pick(KW); return mc('¿Cuál está bien escrita? 🔎', it.w, it.bad, { layout: 'three', big: it.e, sub: it.d, key: 'ks-' + it.w, explain: it.tip || `Se escribe ${it.w}, con k.` }); },
  kSyl: it => { it = it || pick(KSYL); const syl = it.w.slice(0, 2); return mc('¿Con qué sílaba empieza? Completa 🧩', syl, ['ka', 'ke', 'ki'].filter(x => x !== syl), { keep: true, layout: 'three', big: it.e, word: '__' + it.w.slice(2), key: 'ksy-' + it.w, explain: `${it.w}: empieza con ${syl}.` }); },
  kSylFix: it => { it = it || pick(KSYL); const syl = it.w.slice(0, 2); const o = ['ka', 'ke', 'ki'].map(v => ({ label: v, value: v })); return { type: 'mc', layout: 'three', prompt: `¿En qué columna va "${it.w}"? 📊`, big: it.e, options: o, answer: syl, key: 'ksf-' + it.w, explain: `${it.w} empieza con ${syl}.` }; },
  kilo: i => { const [p, a, w] = i != null ? KILO[i] : pick(KILO); return mc(p, a, w, { layout: 'two', key: 'kilo-' + p, explain: 'kilogramo = 1000 gramos · kilolitro = 1000 litros · kilómetro = longitud' }); },
  kiloFill: i => { const [s, a] = i != null ? KILO_FILL[i] : pick(KILO_FILL); return mc('Completa la oración ✏️', a, ['kilogramo', 'kilolitro', 'kilómetro'].filter(x => x !== a), { layout: 'three', show: s, key: 'kf-' + s }); },
  kOrder: s => { s = s || pick(K_SENT); const w = s.split(' '); return { type: 'order', prompt: 'Ordena la oración 🧩', sub: 'La palabra con MAYÚSCULA va primero.', items: w, answer: w, sep: ' ', suffix: '.', speakItems: true, speak: s + '.', key: 'ko-' + s }; },
  kType: it => { it = it || pick(KW); return { type: 'type', prompt: 'Escribe la palabra ✍️', big: it.e, sub: it.d + (it.proper ? ' (nombre propio)' : ''), say: it.w, answer: [it.w], caseSensitive: !!it.proper, accent: true, hint: '_ '.repeat(it.w.length).trim(), placeholder: 'Escribe aquí', key: 'kt-' + it.w, explain: it.tip || 'Con k.' }; },
  kProper: () => { const it = pick(KW.filter(x => x.proper)); return mc('¿Cuál está bien escrito? 🗺️', it.w, it.bad, { layout: 'three', big: it.e, sub: it.d, key: 'kp-' + it.w, explain: it.tip }); },
  kFact: () => pick([
    () => mc('Las palabras con k casi siempre vienen de…', 'otros idiomas 🌍', ['los números 🔢', 'los colores 🎨'], { layout: 'one' }),
    () => mc('"ke" y "ki" suenan igual que…', 'que y qui', ['ca y co', 'ge y gi'], { layout: 'three', explain: 'kermés suena igual que "quermés", ¡pero se escribe con k!' }),
  ])(),

  /* ---------- Ortografía: ca, co, cu ---------- */
  cSyl: it => { it = it || pick(CW); const syl = it.w.slice(0, 2); return mc('Completa con ca, co o cu 🧩', syl, ['ca', 'co', 'cu'].filter(x => x !== syl), { keep: true, layout: 'three', big: it.e, word: '__' + it.w.slice(2), key: 'cs-' + it.w, explain: `${it.w}: empieza con ${syl}.` }); },
  cSort: it => { it = it || pick(CW); const syl = it.w.slice(0, 2); return { type: 'mc', layout: 'three', prompt: `¿En qué columna va "${it.w}"? 📊`, big: it.e, options: ['ca', 'co', 'cu'].map(v => ({ label: v, value: v })), answer: syl, key: 'cso-' + it.w, explain: `${it.w} empieza con ${syl}.` }; },
  cSpell: it => { it = it || pick(CW); return mc('¿Cuál está bien escrita? 🔎', it.w, [it.bad, 'k' + it.w.slice(1)], { layout: 'three', big: it.e, key: 'csp-' + it.w, explain: it.tip }); },
  cType: it => { it = it || pick(CW); return { type: 'type', prompt: 'Escribe la palabra ✍️', big: it.e, say: it.w, answer: [it.w], accent: true, hint: '_ '.repeat(it.w.length).trim(), placeholder: 'Escribe aquí', key: 'ct-' + it.w, explain: it.tip }; },
  cFill: i => { const [s, w, e] = i != null ? P22[i] : pick(P22); return { type: 'type', prompt: 'Completa la oración ✍️', big: e, show: s, answer: [w], accent: true, placeholder: 'Escribe la palabra', key: 'cf-' + w, explain: `${s.replace('___', w)}` }; },
  cTap: i => { const [s, a] = i != null ? KAREN[i] : pick(KAREN); return tapSentence(s, a, { prompt: 'Toca las palabras con ca, co o cu 👆', sub: `Del texto de Karen Caballero · Hay ${a.length} ${a.length === 1 ? 'palabra' : 'palabras'}`, key: 'ktap-' + s }); },
  cRule: () => pick([
    () => mc('Las sílabas ca, co y cu se escriben con…', 'c', ['k', 'q'], { layout: 'three', explain: 'ca, co, cu ➜ con c (casa, conejo, cuna).' }),
    () => { const it = pick(CW.filter(x => x.w.startsWith('cu'))); return mc('¿Qué palabra empieza con "cu"?', { label: it.w, emoji: it.e, value: it.w }, sample(CW.filter(x => !x.w.startsWith('cu')), 2).map(x => ({ label: x.w, emoji: x.e, value: x.w })), { key: 'cr-' + it.w }); },
  ])(),

  /* ---------- Dictado ---------- */
  dictK: it => dictQ(it || pick(KW)),
  dictC: it => dictQ(it || pick(CW)),
  dictN: it => dictQ(it || pick(NW)),
};
/* ============================================================
   COMPRENSIÓN LECTORA (textos originales, nivel 2°)
   Cada pregunta: [tipo, pregunta, correcta, [incorrectas], explicación]
   Tipos: L literal · S secuencia · V vocabulario · I idea principal · F inferencia · T tipo de texto/propósito
   ============================================================ */
const QTYPE = { L: '🔎 Busca la respuesta en el texto', S: '🔢 ¿En qué orden pasó?', V: '📖 ¿Qué significa la palabra?', I: '💡 ¿De qué trata?', F: '🤔 Piensa: la respuesta no está escrita tal cual', T: '🗂️ ¿Qué tipo de texto es? ¿Para qué sirve?', D: '💭 Piensa y dilo en voz alta' };
const TEXTS = [
  { id: 'cometa', kind: 'Cuento', emoji: '🪁', color: '#3b82f6', title: 'La cometa de Tomás',

function clockSVG(hh, mm, size = 230) {
  const c = 100, num = [];
  for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; num.push(`<text x="${c + 72 * Math.sin(a)}" y="${c - 72 * Math.cos(a) + 8}" font-size="22" font-weight="bold" text-anchor="middle" fill="#3a2e6e">${i}</text>`); }
  const ticks = [];
  for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, r1 = i % 5 ? 88 : 83; ticks.push(`<line x1="${c + r1 * Math.sin(a)}" y1="${c - r1 * Math.cos(a)}" x2="${c + 92 * Math.sin(a)}" y2="${c - 92 * Math.cos(a)}" stroke="#9b93c9" stroke-width="${i % 5 ? 1 : 3}"/>`); }
  const ha = ((hh % 12) + mm / 60) * 30, ma = mm * 6;
  const hand = (ang, len, w, col) => `<line x1="${c}" y1="${c}" x2="${c + len * Math.sin(ang * Math.PI / 180)}" y2="${c - len * Math.cos(ang * Math.PI / 180)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#3b82f6" stroke-width="6"/>${ticks.join('')}${num.join('')}${hand(ha, 45, 8, '#14b8a6')}${hand(ma, 70, 5, '#2196f3')}<circle cx="100" cy="100" r="6" fill="#3a2e6e"/></svg>`;
}

function calHTML(m, marks = []) {

  let cells = '<tr>' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<th>${d}</th>`).join('') + '</tr><tr>';

  const bRow = String(b).padStart(w, ' ').split('').map((ch, i) => `<td>${i === 0 ? (op === '-' ? '−' : '+') : ch === ' ' ? '' : ch}</td>`).join('');

}
function columnSteps(a, op, b) {
  const au = a % 10, ad = Math.floor(a / 10), bu = b % 10, bd = Math.floor(b / 10);
  if (op === '+') {
    const u = au + bu;
    if (u < 10) return `Unidades: ${au} + ${bu} = ${u}. Decenas: ${ad} + ${bd} = ${ad + bd}. Resultado: ${a + b}.`;

  return `Unidades: a ${au} no le puedo quitar ${bu} ➜ le pido 1 decena al ${ad} y el ${au} se vuelve ${au + 10}: ${au + 10} − ${bu} = ${au + 10 - bu}. Decenas: el ${ad} se volvió ${ad - 1}: ${ad - 1} − ${bd} = ${ad - 1 - bd}. Resultado: ${a - b}.`;

function evalLR(t) { let v = t[0]; const steps = []; for (let i = 1; i < t.length; i += 2) { const nv = t[i] === '+' ? v + t[i + 1] : v - t[i + 1]; steps.push(`${v} ${t[i] === '+' ? '+' : '−'} ${t[i + 1]} = ${nv}`); v = nv; } return { v, steps }; }

const digits = n => [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10];

const posExpandMC = n => { n = n || ri(101, 999); const [c, d, u] = digits(n);

const qKey = q => q.key || [q.prompt, q.show, q.word, q.big].join('|');
// Examen: toma preguntas de cada tema por turnos; los temas con weight tienen más turnos (el cartel vale doble)
function buildExam(topics, n) {
  const pools = [];
  for (const t of topics) {
    const w = t.weight || 1, qs = shuffle(t.exam());
    for (let k = 0; k < w; k++) pools.push(qs.filter((_, i) => i % w === k));
  }
  const order = shuffle(pools), out = [], seen = new Set();
  let added = true;
  while (out.length < n && added) {
    added = false;
    for (const p of order) {
      if (out.length >= n) break;
      while (p.length) { const q = p.shift(); if (!seen.has(qKey(q))) { seen.add(qKey(q)); out.push(q); added = true; break; } }
    }
  }
  return shuffle(out);
}
function startExam(sectionId) {
  const sec = SECTIONS.find(s => s.id === sectionId);
  const topics = sec ? TOPICS.filter(t => t.section === sec.id) : TOPICS;
  const qs = sec && sec.buildExam ? sec.buildExam() : buildExam(topics, sec ? sec.examN : 20);
  const title = sec ? (sec.buildExam ? '📝 Mini examen de Comprensión' : `📝 Examen: ${sec.name}`) : '🏆 Mini examen';
  runQuiz({ title, questions: qs, mode: 'exam',
    onDone: (score, total, review) => showResults({ title, score, total, review, id: sec ? 'exam-' + sec.id : 'exam', again: () => startExam(sectionId), exam: true }) });
}

function showResults({ title, score, total, review, id, again, next, nextLabel }) {
  const stars = starsFor(score, total);
  saveBest(id, stars);
  const msg = stars === 3 ? '¡Increíble! Eres una estrella 🌟' : stars === 2 ? '¡Muy bien! Ya casi lo dominas 💪' : stars === 1 ? '¡Buen intento! Vamos a practicar un poquito más 🌈' : '¡No te rindas! Repasa la explicación y vuelve a intentar 💙';
  const mistakes = review.filter(r => !r.ok);
  screen(title, goHome,
    h('div', { class: 'card center' },
      h('div', { class: 'result-stars' }, starStr(stars)),
      h('div', { class: 'result-score' }, `${score} / ${total}`),
      h('p', { style: { fontSize: '26px' } }, msg),
      mistakes.length ? h('div', { class: 'review', style: { textAlign: 'left' } }, h('b', null, 'Para repasar:'),
        h('ul', null, mistakes.map(m => h('li', null, m.prompt + ' ➜ ', h('b', null, m.answer))))) : null),
    h('div', { class: 'actions' },
      h('button', { class: 'big-btn orange', onclick: again }, '🔁 Otra vez'),
      next ? h('button', { class: 'big-btn green', onclick: next }, nextLabel) : null,
      h('button', { class: 'big-btn blue', onclick: goHome }, '🏠 Inicio')));
  if (stars >= 2) { confetti(stars === 3 ? 40 : 20); beep(true); }
}

/* ============================================================
   MOTOR DE PREGUNTAS
   práctica: 2 intentos (al 2º error se muestra la respuesta y el porqué)
   examen: un intento, se muestra la respuesta correcta
   ============================================================ */
function runQuiz({ title, questions, mode, onDone }) {
  let idx = 0, score = 0;
  const review = [];
  const exam = mode === 'exam';
  const next = () => { idx++; idx < questions.length ? render() : onDone(score, questions.length, review); };

  function render() {
    const q = questions[idx];
    window.__curQ = q; // (para pruebas)
    let tries = 0, done = false, given = ''; // given = lo que contestó (para "Errores para repasar")
    const fb = h('div', { class: 'feedback' });
    const actions = h('div', { class: 'actions' });
    const scoreEl = h('span', null, `⭐ ${score}`);
    const context = q.passage ? ` (${q.passage.title})` : q.dict ? ' (dictado)' : q.show ? ` «${q.show.length > 70 ? q.show.slice(0, 70) + '…' : q.show}»` : q.word ? ` ${q.big || ''} ${q.word}` : q.big ? ` ${q.big}` : '';

    function finish(ok, answerText) {
      done = true;
      if (ok && tries === 0) score++;
      review.push({ ok: ok && tries === 0, prompt: q.prompt + context, answer: answerText });
      scoreEl.textContent = `⭐ ${score}`;
      actions.innerHTML = '';
      if (q.speak) actions.append(h('button', { class: 'big-btn yellow', onclick: () => speak(q.speak) }, '🔊 Escuchar'));
      const nb = h('button', { class: 'big-btn green', onclick: next }, idx + 1 < questions.length ? 'Siguiente ➜' : 'Ver resultado 🏁');
      actions.append(nb);
      // Que "Siguiente" quede a la vista sin tener que hacer scroll
      setTimeout(() => { try { nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {} }, 150);
    }
    // Devuelve true si la pregunta terminó.
    function result(ok, answerText, extraMsg) {
      fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = '';
      if (ok) {
        beep(true);
        fb.append(h('div', null, pick(PRAISE)));
        if (tries > 0) fb.append(h('div', { style: { fontSize: '20px' } }, '(A la próxima, ¡al primer intento! 😉)'));
        if (q.explain && q.dict) fb.append(h('div', { class: 'why' }, '💡 ' + q.explain));
        finish(true, answerText);
        return true;
      }
      beep(false);
      if (window.Errores) Errores.log({ materia: 'Español', tema: title, pregunta: q.prompt + context, respuesta: given, correcta: answerText, modo: exam ? 'examen' : 'práctica' });
      if (!exam && tries === 0) {
        tries++;
        fb.append(h('div', null, extraMsg || pick(TRY_AGAIN)));
        return false;
      }
      tries++;
      fb.append(...[extraMsg || exam ? h('div', null, extraMsg || 'Uy, esa no era 😅') : null,
        h('div', null, 'La respuesta correcta es:'),
        h('div', { class: 'answer' }, answerText), q.explain ? h('div', { class: 'why' }, '💡 ' + q.explain) : null].filter(Boolean));
      finish(false, answerText);
      return true;
    }

    const body = h('div', { class: 'card' });
    // Bocina para leer la pregunta en voz alta (nunca lee la respuesta)
    const readText = q.dict ? null : q.say !== undefined ? q.say : stripEmoji(q.prompt + (q.show ? '. ' + q.show : ''));
    if (q.passage) body.append(passageEl(q.passage));
    const head = [h('div', { class: 'prompt' }, q.prompt, readText && !q.big ? h('span', null, ' ', speakBtn(readText, true)) : null), q.sub ? h('div', { class: 'sub' }, q.sub) : null];
    if (q.big) head.push(h('div', { class: 'bigshow', style: q.bigIsWord ? { fontSize: '64px', fontWeight: 'bold' } : null }, q.big, readText && q.say ? h('span', null, ' ', speakBtn(readText, true)) : null));
    if (q.word) head.push(h('div', { class: 'bigword' }, q.word));
    if (q.visual) head.push(h('div', { class: 'visual', html: q.visual }));
    if (q.show) head.push(h('div', { class: 'showsentence' + (q.showLeft ? ' left' : '') }, q.show));
    if (q.speakButtons) head.push(h('div', { class: 'row', style: { margin: '10px 0' } }, q.speakButtons.map(b => h('button', { class: 'big-btn yellow', onclick: () => speak(b.text, b.rate) }, b.label))));
    body.append(...head.filter(Boolean));

    if (q.type === 'think') {
      const model = h('div', { class: 'model', style: { display: 'none' } }, '💬 ', h('b', null, 'Ejemplo: '), q.model, ' ', speakBtn(q.model, true));
      const show = h('button', { class: 'big-btn blue', onclick: () => {
        if (done) return;
        model.style.display = 'block'; show.style.display = 'none';
        fb.className = 'feedback show ok'; fb.innerHTML = ''; fb.append(h('div', null, '¡Muy bien pensado! 💭 Tu respuesta puede ser diferente: lo importante es explicar por qué.'));
        finish(true, q.model);
      } }, '👀 Ver ejemplo de respuesta');
      body.append(h('div', { class: 'think' },
        h('div', { class: 'tlabel' }, '💭 Piensa y dilo en voz alta'),
        h('div', { class: 'tsteps' }, 'Piensa tu respuesta y dila con tus palabras (empieza con "Yo…" y explica por qué). Luego mira el ejemplo.'),
        show, model));
    }

    if (q.type === 'column') {
      // Cuenta como correcta al primer intento solo si no hubo errores en ningún paso
      body.append(Columna.create({ a: q.a, b: q.b, op: q.op, speak, onDone: ({ mistakes, errs }) => {
        if (mistakes && window.Errores) Errores.log({ materia: 'Español', tema: title, pregunta: q.prompt, respuesta: errs.join(' · '), correcta: q.answer[0], modo: exam ? 'examen' : 'práctica' });
        tries = mistakes ? 1 : 0; result(true, q.answer[0]);
      } }));
    }

    if (q.type === 'mc') {
      const opts = h('div', { class: 'opts' + (q.layout ? ' ' + q.layout : '') });
      const co = q.options.find(o => o.value === q.answer) || {};
      const correctLabel = [co.emoji, co.label].filter(Boolean).join(' ');
      q.options.forEach(o => {
        const b = h('button', { class: 'opt', onclick: () => {
          if (done || b.disabled) return;
          given = [o.emoji, o.label].filter(Boolean).join(' ') || String(o.value);
          const ok = o.value === q.answer;
          b.classList.add(ok ? 'correct' : 'wrong', ok ? 'pop' : 'shake');
          const ended = result(ok, correctLabel);
          if (!ok) b.disabled = true;
          if (ended) opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.v === String(q.answer)) x.classList.add('correct'); });
        } }, o.emoji ? h('span', { class: 'oe' }, o.emoji) : null, o.label ? h('span', null, o.label, o.sub ? h('div', { style: { fontSize: '17px', color: '#64748b' } }, o.sub) : null) : null);
        b.dataset.v = String(o.value);
        opts.append(b);
      });
      body.append(opts);
    }

    if (q.type === 'order') {
      const wrap = h('div', { class: q.long ? 'long' : '' });
      const pool = h('div', { class: 'pool' }), slots = h('div', { class: 'slots' });
      const tiles = shuffle(q.items.map((txt, i) => ({ txt, color: TILE_COLORS[i % TILE_COLORS.length] })));
      const sep = q.sep != null ? q.sep : ', ';
      const answerText = q.answerText || (q.answer.join(sep) + (q.suffix || ''));
      let placed = [];
      const check = h('button', { class: 'big-btn', disabled: true, onclick: doCheck }, 'Comprobar ✔');
      const reset = h('button', { class: 'big-btn orange', onclick: () => { if (!done) { placed = []; draw(); } } }, '↩ Borrar');
      function draw(marks) {
        pool.innerHTML = ''; slots.innerHTML = '';
        tiles.forEach(t => { if (!placed.includes(t)) pool.append(h('button', { class: 'tile', style: { background: t.color }, onclick: () => { if (done) return; placed.push(t); if (q.speakItems) speak(t.txt); draw(); } }, t.txt)); });
        if (!placed.length) slots.append(h('span', { class: 'slot-hint' }, 'Toca las fichas en orden 👇'));
        placed.forEach((t, i) => slots.append(h('button', { class: 'tile' + (marks ? (marks[i] ? ' ok' : ' no') : ''), style: { background: t.color }, onclick: () => { if (done) return; placed.splice(i, 1); draw(); } }, h('span', { class: 'num' }, i + 1), t.txt)));
        if (placed.length && q.suffix) slots.append(h('span', { class: 'suffix' }, q.suffix));
        check.disabled = placed.length !== tiles.length || done;
        if (!pool.children.length && !done) pool.append(h('span', { class: 'slot-hint' }, '¡Listo! Toca "Comprobar" ✔'));
      }
      function doCheck() {
        given = placed.map(t => t.txt).join(sep);
        const marks = placed.map((t, i) => t.txt === q.answer[i]);
        const ok = marks.every(Boolean);
        draw(marks);
        const ended = result(ok, answerText, ok ? null : '¡Casi! Las rojas no van ahí 💪');
        if (!ended) setTimeout(() => { if (done) return; placed = placed.filter((t, i) => marks[i] && marks.slice(0, i).every(Boolean)); draw(); }, 1300);
        if (ended) { check.disabled = true; reset.disabled = true; }
      }
      draw();
      wrap.append(slots, pool);
      body.append(wrap);
      actions.append(reset, check);
    }

    if (q.type === 'tap') {
      const clean = t => t.replace(/[.,;:¡!¿?"]/g, '');
      const box = h('div', { class: 'taps' + (q.chips ? ' chipsmode' : '') });
      const btns = q.tokens.map(tk => { const b = h('button', { class: 'wtok', onclick: () => { if (done) return; b.classList.toggle('sel'); b.classList.remove('no'); updateCheck(); } }, tk.t); b._ok = tk.ok; return b; });
      box.append(...btns);
      const answerText = q.tokens.filter(t => t.ok).map(t => clean(t.t)).join(', ');
      const check = h('button', { class: 'big-btn', disabled: true, onclick: doCheck }, 'Comprobar ✔');
      const updateCheck = () => { check.disabled = done || !btns.some(b => b.classList.contains('sel')); };
      function doCheck() {
        if (done) return;
        given = btns.filter(b => b.classList.contains('sel')).map(b => b.textContent).join(', ') || '(nada)';
        const extra = btns.filter(b => b.classList.contains('sel') && !b._ok);
        const missing = btns.filter(b => !b.classList.contains('sel') && b._ok);
        const ok = !extra.length && !missing.length;
        let msg = null;
        if (!ok) msg = [extra.length ? `${extra.length === 1 ? 'Una palabra no va' : extra.length + ' palabras no van'} (en rojo).` : '', missing.length ? `Te ${missing.length === 1 ? 'falta 1' : 'faltan ' + missing.length}.` : ''].join(' ') + ' 🤔';
        extra.forEach(b => b.classList.add('no'));
        const ended = result(ok, answerText, msg);
        if (!ended) setTimeout(() => { if (done) return; extra.forEach(b => b.classList.remove('sel', 'no')); updateCheck(); }, 1300);
        if (ended) {
          btns.forEach(b => { b.disabled = true; const s = b.classList.contains('sel'); b.classList.remove('sel'); if (b._ok) b.classList.add(s ? 'ok' : 'miss', 'ok'); else if (s) b.classList.add('no'); });
          check.disabled = true;
        }
      }
      body.append(box);
      actions.append(check);
    }

    if (q.type === 'type') {
      if (q.hint) body.append(h('div', { class: 'hint' }, q.hint));
      const input = h('input', { type: 'text', inputmode: q.numeric ? 'numeric' : null, autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done', placeholder: q.placeholder || '', 'aria-label': 'Respuesta' });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') doCheck(); });
      const check = h('button', { class: 'big-btn', onclick: doCheck }, 'Comprobar ✔');
      const norm = s => s.normalize('NFC').trim().replace(/\s+/g, ' ').replace(/[.!]+$/, '').trim();
      function doCheck() {
        if (done) return;
        given = input.value.trim();
        let v = norm(input.value);
        if (q.numeric) v = v.replace(/[\s,]/g, '');
        if (!v) { input.focus(); return; }
        const answers = q.answer.map(norm);
        const same = (a, b, ci, na) => { if (na) { a = noAccent(a); b = noAccent(b); } if (ci) { a = a.toLowerCase(); b = b.toLowerCase(); } return a === b; };
        const ok = answers.some(a => same(a, v, !q.caseSensitive, !q.accent));
        let msg = null;
        if (!ok) {
          const caseOnly = answers.some(a => same(a, v, true, !q.accent));
          const accentOnly = answers.some(a => same(a, v, !q.caseSensitive, true));
          const both = answers.some(a => same(a, v, true, true));
          if (caseOnly) msg = '¡Casi! Es nombre propio: empieza con MAYÚSCULA 🔠';
          else if (accentOnly) msg = '¡Casi! Revisa el acento ✍️';
          else if (both) msg = '¡Casi! Revisa el acento y la MAYÚSCULA ✍️🔠';
        }
        const ended = result(ok, q.answer[0], msg);
        input.classList.add(ok ? 'pop' : 'shake'); setTimeout(() => input.classList.remove('shake', 'pop'), 450);
        if (ended) { input.disabled = true; check.disabled = true; }
        else { try { input.focus({ preventScroll: true }); } catch (e) {} }
      }
      body.append(window.Escritura ? Escritura.pad({ q, input, lang: 'es', submit: doCheck, typebox: h('div', { class: 'typebox' }, input) }) : h('div', { class: 'typebox' }, input));
      actions.append(check);
      setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) {} }, 50);
    }

    body.append(fb, actions);
    screen(title, () => { if (confirm('¿Salir? Se perderá el avance de esta práctica.')) goHome(); },
      h('div', { class: 'progress' }, h('div', { style: { width: (idx / questions.length * 100) + '%' } })),
      h('div', { class: 'qmeta' }, h('span', null, `Pregunta ${idx + 1} de ${questions.length}`), exam ? h('span', null, '🏆 Examen') : h('span', null, '🧠 Práctica'), scoreEl),
      body);
    // Se llama dentro del toque del botón (el iPad necesita un toque para hablar)
    if (q.autoSpeak && q.speak) speak(q.speak);
  }
  render();
}

showHome();
if (window.Escritura) Escritura.borrador();
// Enlace directo a una sección desde el calendario (p. ej. #grammar)
if (location.hash) { const el = document.getElementById('sec-' + location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); }
</script>
